<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — مِذكَرتي</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --orange:#FF7A00;
  --orange-dark:#E65100;
  --orange-soft:rgba(255,122,0,.08);
  --bg:#0F0F0F;
  --bg2:#171717;
  --card:#1E1E1E;
  --text:#F5F5F5;
  --muted:#8A8A8A;
  --border:#2A2A2A;
  --green:#4CAF50;
  --red:#F44336;
  --blue:#2196F3;
  --purple:#8B5CF6;
  --font:'Tajawal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(circle at 20% 20%,var(--orange-soft) 0%,transparent 40%),
    radial-gradient(circle at 80% 80%,var(--orange-soft) 0%,transparent 40%);
  background-attachment:fixed;
}
.app{display:flex;min-height:100vh}

/* ============ Sidebar ============ */
.sidebar{
  width:260px;background:var(--bg2);border-left:1px solid var(--border);
  padding:20px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  transition:.3s;
}
.sidebar .brand{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
  padding-bottom:18px;border-bottom:1px solid var(--border);
}
.sidebar .brand .logo{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;
  box-shadow:0 6px 20px rgba(255,122,0,.35);
}
.sidebar .brand h1{font-size:16px;color:var(--orange);font-weight:900;line-height:1.2}
.sidebar .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.nav-item{
  padding:12px 14px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:600;color:var(--muted);
  transition:.2s;text-decoration:none;
}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--orange);color:#fff;box-shadow:0 4px 15px rgba(255,122,0,.4)}
.nav-item i{width:20px;text-align:center;font-size:15px}
.sidebar-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--border)}

/* ============ Main ============ */
.main{flex:1;padding:26px;overflow-y:auto;min-width:0}
.page-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:22px;flex-wrap:wrap;gap:12px;
}
.page-head h2{font-size:22px;font-weight:800;color:var(--orange);display:flex;align-items:center;gap:10px}
.page-head p{color:var(--muted);font-size:13px;margin-top:4px}

/* ============ Cards ============ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:22px;margin-bottom:18px;
  transition:.2s;
}
.card:hover{border-color:rgba(255,122,0,.3)}
.card h3{
  font-size:16px;color:var(--orange);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;font-weight:700;
}

/* ============ Form ============ */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid.full{grid-template-columns:1fr}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
input,select,textarea{
  width:100%;padding:11px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);font-size:14px;font-family:var(--font);
  outline:none;transition:.2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
textarea{min-height:100px;resize:vertical;line-height:1.7}

/* ============ Buttons ============ */
.btn{
  padding:11px 20px;border:none;border-radius:10px;
  cursor:pointer;font-size:14px;font-weight:700;
  transition:.2s;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font);
}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;box-shadow:0 4px 15px rgba(255,122,0,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,122,0,.5)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.9;transform:translateY(-1px)}
.btn-sm{padding:8px 14px;font-size:12px}

/* ============ List Items ============ */
.item{
  background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:14px;margin-bottom:10px;
  display:flex;gap:14px;align-items:flex-start;
  transition:.2s;
}
.item:hover{border-color:var(--orange);transform:translateX(-2px)}
.item .icon{
  width:40px;height:40px;border-radius:10px;
  background:var(--orange-soft);color:var(--orange);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.item .body{flex:1;min-width:0}
.item .body .title{font-weight:700;margin-bottom:4px}
.item .body .meta{font-size:12px;color:var(--muted);line-height:1.6}
.item .actions{display:flex;gap:6px;flex-shrink:0}

/* ============ Empty ============ */
.empty-box{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-box i{font-size:40px;color:var(--orange);opacity:.4;margin-bottom:12px;display:block}
.empty-box p{font-size:14px}

/* ============ Loading / Login ============ */
.center-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.login-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:40px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.login-box .icon-big{
  width:80px;height:80px;border-radius:24px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:36px;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.login-box h1{color:var(--orange);font-size:24px;margin-bottom:8px;font-weight:900}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.8}
.login-box .back-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:20px;
  color:var(--orange);text-decoration:none;font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:8px;transition:.2s;
}
.login-box .back-link:hover{background:var(--orange-soft)}

/* ============ Alerts ============ */
.alert{
  padding:14px;border-radius:12px;margin-bottom:16px;
  display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;
}
.alert.info{background:rgba(33,150,243,.1);border:1px solid rgba(33,150,243,.3);color:#64B5F6}
.alert.success{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);color:#81C784}
.alert.error{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);color:#EF9A9A}
.alert i{margin-top:2px}

/* ============ Stats Grid ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:14px;padding:20px;text-align:center;
  transition:.2s;
}
.stat-card:hover{border-color:var(--orange);transform:translateY(-3px)}
.stat-card i{
  font-size:26px;color:var(--orange);margin-bottom:10px;
  width:52px;height:52px;border-radius:14px;
  background:var(--orange-soft);display:inline-flex;
  align-items:center;justify-content:center;
}
.stat-card .num{font-size:28px;font-weight:900;color:var(--orange);line-height:1}
.stat-card .lbl{font-size:13px;color:var(--muted);margin-top:8px;font-weight:600}

/* ============ Badge ============ */
.badge{
  font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;
  background:var(--orange-soft);color:var(--orange);
  display:inline-block;
}
.badge.high{background:rgba(244,67,54,.15);color:#EF9A9A}
.badge.green{background:rgba(76,175,80,.15);color:#81C784}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:20px;left:20px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  color:#fff;padding:14px 22px;border-radius:12px;
  font-size:14px;font-weight:600;z-index:300;
  transform:translateY(100px);opacity:0;transition:.3s;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(255,122,0,.5);
  max-width:calc(100vw - 40px);
}
.toast.show{transform:translateY(0);opacity:1}

/* ============ Mobile Menu ============ */
.menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:100;
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--bg2);color:var(--orange);cursor:pointer;
  align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.4);
}

/* ============ Scrollbar ============ */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--orange)}

/* ============ Media ============ */
@media(max-width:768px){
  .sidebar{
    position:fixed;right:0;top:0;height:100vh;z-index:50;
    transform:translateX(100%);transition:.3s;width:280px;
    box-shadow:-10px 0 40px rgba(0,0,0,.6);
  }
  .sidebar.show{transform:translateX(0)}
  .main{padding:16px;padding-top:70px}
  .menu-btn{display:flex}
  .page-head h2{font-size:18px}
  .card{padding:16px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ========== LOADING ========== -->
<div id="loading" class="center-wrap">
  <div style="text-align:center">
    <i class="fa-solid fa-spinner" style="font-size:48px;color:var(--orange);animation:spin 1s linear infinite"></i>
    <p style="color:var(--muted);margin-top:16px;font-size:14px">جاري التحقق من الصلاحيات...</p>
  </div>
</div>

<!-- ========== ACCESS DENIED / LOGIN ========== -->
<div id="accessDenied" class="center-wrap" style="display:none">
  <div class="login-box">
    <div class="icon-big"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>لوحة التحكم</h1>
    <p id="deniedMessage">هذي الصفحة للمشرفين فقط.<br>سجّل دخول بحسابك المصرّح.</p>
    <button id="signInBtn" class="btn btn-primary" style="width:100%;justify-content:center" onclick="signIn()">
      <i class="fa-brands fa-google"></i> تسجيل الدخول بجوجل
    </button>
    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-right"></i> رجوع للموقع
    </a>
  </div>
</div>

<!-- ========== ADMIN PANEL ========== -->
<div id="adminPanel" class="app" style="display:none">
  <button class="menu-btn" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
    <i class="fa-solid fa-bars"></i>
  </button>

  <aside class="sidebar" id="adminSidebar">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
      <div>
        <h1>لوحة التحكم</h1>
        <small id="adminEmail">admin@studymate</small>
      </div>
    </div>

    <div class="nav-item active" data-page="exams" onclick="switchPage('exams')">
      <i class="fa-solid fa-file-pen"></i> الامتحانات
    </div>
    <div class="nav-item" data-page="news" onclick="switchPage('news')">
      <i class="fa-solid fa-newspaper"></i> الأخبار
    </div>
    <div class="nav-item" data-page="announcements" onclick="switchPage('announcements')">
      <i class="fa-solid fa-bullhorn"></i> الإعلانات
    </div>
    <div class="nav-item" data-page="stats" onclick="switchPage('stats')">
      <i class="fa-solid fa-chart-line"></i> الإحصائيات
    </div>
    <div class="nav-item" data-page="admins" onclick="switchPage('admins')">
      <i class="fa-solid fa-users-gear"></i> المشرفون
    </div>

    <div class="sidebar-footer">
      <a href="/" class="nav-item">
        <i class="fa-solid fa-house"></i> الموقع الرئيسي
      </a>
      <div class="nav-item" onclick="signOut()">
        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
      </div>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   SUPABASE CONFIG
===================================================== */
var SUPABASE_URL = 'https://ncrycgbrstafdouvipzc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var currentUser = null;
var isAdmin = false;
var currentPage = 'exams';
var data = { exams: [], news: [], announcements: [], admins: [], stats: {} };

/* =====================================================
   HELPERS
===================================================== */
function toast(msg, icon){
  icon = icon || 'fa-check-circle';
  var t = document.getElementById('toast');
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> <span>' + msg + '</span>';
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function fmtDate(s){
  try {
    var d = new Date(s);
    return d.toLocaleDateString('ar-DZ', {year:'numeric', month:'long', day:'numeric'});
  } catch(e){ return s; }
}

function fmtDateTime(s){
  try {
    var d = new Date(s);
    return d.toLocaleDateString('ar-DZ') + ' - ' + d.toLocaleTimeString('ar-DZ', {hour:'2-digit', minute:'2-digit'});
  } catch(e){ return s; }
}

/* =====================================================
   AUTH
===================================================== */
async function signIn(){
  var result = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if(result.error) alert('خطأ: ' + result.error.message);
}

async function signOut(){
  if(!confirm('تسجيل الخروج؟')) return;
  await sb.auth.signOut();
  location.reload();
}

async function checkAdmin(user){
  var result = await sb.from('admins').select('id').eq('user_id', user.id).maybeSingle();
  return !!result.data;
}

function showLoading(){
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('accessDenied').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'none';
}

function showDenied(message, showSignIn){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('accessDenied').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  if(message) document.getElementById('deniedMessage').innerHTML = message;
  document.getElementById('signInBtn').style.display = showSignIn ? 'inline-flex' : 'none';
}

function showPanel(user){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('accessDenied').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'flex';
  document.getElementById('adminEmail').textContent = user.email || 'admin';
}

sb.auth.onAuthStateChange(async function(event, session){
  showLoading();
  if(session && session.user){
    currentUser = session.user;
    var admin = await checkAdmin(session.user);
    if(admin){
      isAdmin = true;
      showPanel(session.user);
      await loadAllData();
      renderPage();
    } else {
      isAdmin = false;
      showDenied(
        'إيميلك <b style="color:var(--orange)">' + escapeHtml(session.user.email) + '</b><br>مو مسجل كمشرف في النظام.<br>تواصل مع المسؤول لإضافتك.',
        false
      );
    }
  } else {
    currentUser = null;
    isAdmin = false;
    showDenied(null, true);
  }
});

/* =====================================================
   LOAD DATA
===================================================== */
async function loadAllData(){
  try {
    var results = await Promise.all([
      sb.from('exams').select('*').order('exam_date', {ascending:true}),
      sb.from('news').select('*').order('created_at', {ascending:false}),
      sb.from('announcements').select('*').order('created_at', {ascending:false}),
      sb.from('admins').select('*').order('created_at', {ascending:false})
    ]);
    data.exams = results[0].data || [];
    data.news = results[1].data || [];
    data.announcements = results[2].data || [];
    data.admins = results[3].data || [];
  } catch(e){
    console.error('Load error:', e);
    toast('خطأ في تحميل البيانات', 'fa-triangle-exclamation');
  }
}

/* =====================================================
   NAVIGATION
===================================================== */
function switchPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('adminSidebar').classList.remove('show');
  renderPage();
}

function renderPage(){
  var main = document.getElementById('mainContent');
  if(currentPage === 'exams') renderExams(main);
  else if(currentPage === 'news') renderNews(main);
  else if(currentPage === 'announcements') renderAnnouncements(main);
  else if(currentPage === 'stats') renderStats(main);
  else if(currentPage === 'admins') renderAdmins(main);
}

/* =====================================================
   EXAMS
===================================================== */
function renderExams(main){
  main.innerHTML =
    '<div class="page-head">' +
      '<div>' +
        '<h2><i class="fa-solid fa-file-pen"></i> الامتحانات والفروض</h2>' +
        '<p>أضف مواعيد الامتحانات لتظهر لكل المستخدمين</p>' +
      '</div>' +
    '</div>' +

    '<div class="alert info">' +
      '<i class="fa-solid fa-info-circle"></i>' +
      '<span>الامتحانات راح تظهر لكل المستخدمين في صفحة "التقويم" تلقائياً.</span>' +
    '</div>' +

    '<div class="card">' +
      '<h3><i class="fa-solid fa-plus"></i> إضافة امتحان جديد</h3>' +
      '<div class="form-grid">' +
        '<div><label>العنوان</label><input id="exTitle" placeholder="مثال: فرض الرياضيات"></div>' +
        '<div><label>المادة</label><input id="exSubject" placeholder="مثال: رياضيات"></div>' +
        '<div><label>التاريخ</label><input type="date" id="exDate"></div>' +
        '<div><label>الوقت</label><input id="exTime" placeholder="مثال: 8:00 - 10:00"></div>' +
        '<div><label>المستوى</label>' +
          '<select id="exLevel">' +
            '<option value="1AM">1 متوسط</option>' +
            '<option value="2AM">2 متوسط</option>' +
            '<option value="3AM">3 متوسط</option>' +
            '<option value="4AM" selected>4 متوسط</option>' +
            '<option value="all">الكل</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:12px">' +
        '<label>ملاحظات (اختياري)</label>' +
        '<textarea id="exNotes" placeholder="مثال: يشمل الوحدة 1 و 2"></textarea>' +
      '</div>' +
      '<div style="margin-top:14px">' +
        '<button class="btn btn-primary" onclick="addExam()">' +
          '<i class="fa-solid fa-check"></i> إضافة الامتحان' +
        '</button>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<h3><i class="fa-solid fa-list"></i> الامتحانات (' + data.exams.length + ')</h3>' +
      (data.exams.length === 0 ?
        '<div class="empty-box"><i class="fa-solid fa-file-pen"></i><p>لا امتحانات بعد</p></div>' :
        data.exams.map(function(e){
          return '<div class="item">' +
            '<div class="icon"><i class="fa-solid fa-file-pen"></i></div>' +
            '<div class="body">' +
              '<div class="title">' + escapeHtml(e.title) + '</div>' +
              '<div class="meta">' +
                '<i class="fa-regular fa-calendar"></i> ' + fmtDate(e.exam_date) +
                (e.exam_time ? ' · <i class="fa-regular fa-clock"></i> ' + escapeHtml(e.exam_time) : '') +
                (e.subject ? ' · ' + escapeHtml(e.subject) : '') +
                (e.level ? ' · ' + e.level : '') +
              '</div>' +
              (e.notes ? '<div class="meta" style="margin-top:6px"><i class="fa-solid fa-note-sticky"></i> ' + escapeHtml(e.notes) + '</div>' : '') +
            '</div>' +
            '<div class="actions">' +
              '<button class="btn btn-danger btn-sm" onclick="delExam(\'' + e.id + '\')" title="حذف">' +
                '<i class="fa-solid fa-trash"></i>' +

async function addExam(){

async function addAdmin(){
  var email = document.getElementById('admEmail').value.trim().toLowerCase();
  if(!email || email.indexOf('@') === -1){
    toast('اكتب إيميل صحيح', 'fa-triangle-exclamation');
    return;
  }

  // ابحث عن المستخدم في auth.users
  // ملاحظة: ما نقدر نوصل لـ auth.users مباشرة، لكن نقدر نبحث في subjects
  // بدلاً من ذلك، نطلب من المستخدم إنه سجل دخول، ونضيفه بـ user_id

  // للأسف Supabase ما يسمح بالوصول لـ auth.users من الواجهة
  // الحل: الأدمن الحالي يضيف الإيميل، والمستخدم يسجل دخول بعدين
  // لكن الـ user_id ما نعرفه إلا بعد تسجيل الدخول

  toast('هذي الميزة تحتاج إعداد إضافي في Supabase', 'fa-triangle-exclamation');
  alert(
    '📌 لإضافة مشرف جديد:\n\n' +
    '1. اطلب من المشرف يسجل دخول في الموقع مرة وحدة\n' +
    '2. روح Supabase → SQL Editor\n' +
    '3. شغّل:\n\n' +
    "insert into admins (user_id, email)\n" +
    "select id, email from auth.users\n" +
    "where email = '" + email + "';\n\n" +
    '4. ارجع هنا واعمل تحديث للصفحة'
  );
}

async function delAdmin(id, email){
  if(!confirm('حذف "' + email + '" من المشرفين؟')) return;
  var result = await sb.from('admins').delete().eq('id', id);
  if(result.error){ toast('خطأ في الحذف', 'fa-triangle-exclamation'); return; }
  data.admins = data.admins.filter(function(a){ return a.id !== id; });
  toast('تم الحذف');
  renderPage();
}

async function renderStats(main){
  main.innerHTML =
    '<div class="page-head">' +
      '<div>' +
        '<h2><i class="fa-solid fa-chart-line"></i> إحصائيات الموقع</h2>' +

      '</div>' +
    '</div>' +
    '<div id="statsContent">' +
      '<div class="empty-box">' +
        '<i class="fa-solid fa-spinner" style="animation:spin 1s linear infinite"></i>' +
        '<p>جاري تحميل الإحصائيات...</p>' +
      '</div>' +
    '</div>';

  try {
    var results = await Promise.all([
      sb.from('subjects').select('*'),
      sb.from('lessons').select('*'),
      sb.from('cards').select('*'),
      sb.from('notifications').select('*'),
      sb.from('grades').select('*'),
      sb.from('tasks').select('*')
    ]);

    var subjects = results[0].data || [];
    var lessons = results[1].data || [];
    var cards = results[2].data || [];
    var notifications = results[3].data || [];
    var grades = results[4].data || [];
    var tasks = results[5].data || [];

    var usersSet = {};
    subjects.forEach(function(s){ if(s.user_id) usersSet[s.user_id] = true; });
    lessons.forEach(function(l){ if(l.user_id) usersSet[l.user_id] = true; });
    cards.forEach(function(c){ if(c.user_id) usersSet[c.user_id] = true; });
    var usersCount = Object.keys(usersSet).length;

    var memorized = lessons.filter(function(l){ return l.status === 'memorized'; }).length;

    var content = document.getElementById('statsContent');

      '<div class="stats-grid">' +
        '<div class="stat-card">' +

          '<i class="fa-solid fa-circle-check"></i>' +
          '<div class="num">' + memorized + '</div>' +
          '<div class="lbl">درس محفوظ</div>' +
