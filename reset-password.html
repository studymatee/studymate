<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة السر — مِذكَرتي</title>
<link rel="icon" type="image/png" href="/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{
  background:#0A0A0A;color:#F5F5F5;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:
    radial-gradient(circle at 50% 30%,rgba(255,122,0,.1) 0%,transparent 60%),
    radial-gradient(circle at 80% 80%,rgba(255,122,0,.06) 0%,transparent 50%);
}
.box{
  background:#1E1E1E;border:1px solid rgba(255,255,255,.08);
  border-radius:24px;padding:40px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.icon{
  width:90px;height:90px;border-radius:26px;margin:0 auto 24px;
  background:linear-gradient(135deg,#FF7A00,#E65100);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:40px;
  box-shadow:0 20px 60px rgba(255,122,0,.4);
  animation:float 3s ease-in-out infinite;
}
h1{color:#FF7A00;font-size:26px;margin-bottom:8px;font-weight:900}
p{color:#8A8A8A;font-size:14px;margin-bottom:24px;line-height:1.8}
.input-wrap{position:relative;margin-bottom:14px}
.input-wrap i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#7A7A7A;font-size:14px;pointer-events:none;transition:.2s}
.toggle-pass{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#7A7A7A;cursor:pointer;font-size:14px;padding:4px;transition:.2s}
.toggle-pass:hover{color:#FF7A00}
input{
  width:100%;padding:14px 44px 14px 44px;
  border-radius:12px;background:#0F0F0F;
  border:1.5px solid rgba(255,255,255,.08);
  color:#F5F5F5;font-size:15px;font-family:inherit;outline:none;
  transition:.2s;
}
input:focus{border-color:#FF7A00;box-shadow:0 0 0 4px rgba(255,122,0,.1)}
input:focus + i, .input-wrap:focus-within i{color:#FF7A00}
button.submit{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,#FF7A00,#E65100);
  color:#fff;border:none;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;
  box-shadow:0 8px 24px rgba(255,122,0,.3);
  transition:.2s;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
button.submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,122,0,.5)}
button.submit:active{transform:translateY(0) scale(.98)}
button.submit:disabled{opacity:.6;cursor:not-allowed}
.msg{
  padding:14px;border-radius:12px;font-size:13px;
  margin-bottom:16px;display:none;align-items:center;gap:10px;
  line-height:1.6;text-align:right;
}
.msg.show{display:flex;animation:slideDown .3s}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.msg.error{background:rgba(239,68,68,.1);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}
.msg.success{background:rgba(34,197,94,.1);color:#86EFAC;border:1px solid rgba(34,197,94,.3)}
.msg.info{background:rgba(59,130,246,.1);color:#93C5FD;border:1px solid rgba(59,130,246,.3)}
.back-link{
  color:#FF7A00;text-decoration:none;font-size:13px;font-weight:600;
  margin-top:24px;display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:10px;transition:.2s;
}
.back-link:hover{background:rgba(255,122,0,.08)}
.strength{
  font-size:12px;text-align:right;margin-top:-8px;margin-bottom:14px;
  padding-right:4px;transition:.2s;height:16px;
}
.spinner{
  width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="box">

  <!-- Header -->
  <div class="icon"><i class="fa-solid fa-key"></i></div>
  <h1>إعادة تعيين كلمة السر</h1>
  <p id="subtitle">اكتب كلمة السر الجديدة</p>

  <!-- Message Area -->
  <div class="msg" id="msg"></div>

  <!-- Loading State -->
  <div id="loadingState" style="padding:40px 0">
    <div class="spinner" style="width:40px;height:40px;border-width:3px;border-top-color:#FF7A00;margin:0 auto 16px"></div>
    <p style="margin:0">جاري التحقق...</p>
  </div>

  <!-- Form (hidden until verified) -->
  <div id="formState" class="hidden">
    <div class="input-wrap">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="newPass" placeholder="كلمة السر الجديدة" autocomplete="new-password">
      <button type="button" class="toggle-pass" onclick="togglePass('newPass', this)">
        <i class="fa-solid fa-eye"></i>
      </button>
    </div>
    <div class="strength" id="strength"></div>

    <div class="input-wrap">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="newPass2" placeholder="تأكيد كلمة السر" autocomplete="new-password">
      <button type="button" class="toggle-pass" onclick="togglePass('newPass2', this)">
        <i class="fa-solid fa-eye"></i>
      </button>
    </div>

    <button class="submit" id="saveBtn" onclick="updatePass()">
      <i class="fa-solid fa-check"></i>
      <span>حفظ كلمة السر</span>
    </button>

    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-right"></i> رجوع للموقع
    </a>
  </div>

  <!-- Error State -->
  <div id="errorState" class="hidden">
    <p style="color:#EF9A9A;margin-bottom:20px">الرابط غير صالح أو منتهي الصلاحية</p>
    <a href="/" class="back-link" style="background:rgba(255,122,0,.1)">
      <i class="fa-solid fa-arrow-left"></i> رجوع لتسجيل الدخول
    </a>
  </div>

  <!-- Success State -->
  <div id="successState" class="hidden">
    <p style="color:#86EFAC;margin-bottom:20px">✅ تم تغيير كلمة السر بنجاح!</p>
    <a href="/" class="back-link" style="background:rgba(34,197,94,.15);color:#22C55E">
      <i class="fa-solid fa-right-to-bracket"></i> الذهاب لتسجيل الدخول
    </a>
  </div>

</div>

<script>
/* ============ Supabase Config ============ */
var sb = window.supabase.createClient(
  'https://ncrycgbrstafdouvipzc.supabase.co',
  'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73'
);

/* ============ Helpers ============ */
function showMsg(text, type){
  var m = document.getElementById('msg');
  var icons = {error:'fa-triangle-exclamation', success:'fa-check-circle', info:'fa-info-circle'};
  m.className = 'msg show ' + (type || 'info');
  m.innerHTML = '<i class="fa-solid ' + (icons[type] || icons.info) + '"></i><span>' + text + '</span>';
}
function hideMsg(){ document.getElementById('msg').classList.remove('show'); }
function show(el){ document.getElementById(el).classList.remove('hidden'); }
function hide(el){ document.getElementById(el).classList.add('hidden'); }
function togglePass(id, btn){
  var input = document.getElementById(id);
  if(!input) return;
  if(input.type === 'password'){
    input.type = 'text';
    btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
  } else {
    input.type = 'password';
    btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
  }
}

/* ============ Password Strength ============ */
document.getElementById('newPass').addEventListener('input', function(){
  var pass = this.value;
  var el = document.getElementById('strength');
  var s = 0;
  if(pass.length >= 8) s++;
  if(pass.length >= 12) s++;
  if(/[A-Z]/.test(pass)) s++;
  if(/[0-9]/.test(pass)) s++;
  if(/[^A-Za-z0-9]/.test(pass)) s++;
  var labels = ['', 'ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
  var colors = ['', '#EF4444', '#F59E0B', '#EAB308', '#22C55E', '#10B981'];
  if(pass.length === 0){ el.textContent = ''; return; }
  el.textContent = 'قوة كلمة السر: ' + labels[s];
  el.style.color = colors[s];
});

/* ============ Update Password ============ */
async function updatePass(){
  var p1 = document.getElementById('newPass').value;
  var p2 = document.getElementById('newPass2').value;

  if(!p1 || p1.length < 8){
    showMsg('كلمة السر لازم 8 أحرف على الأقل', 'error');
    return;
  }
  if(p1 !== p2){
    showMsg('كلمتا السر ما متطابقتين', 'error');
    return;
  }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>جاري الحفظ...</span>';
  hideMsg();

  try {
    var result = await sb.auth.updateUser({password: p1});
    if(result.error){
      showMsg('خطأ: ' + result.error.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check"></i><span>حفظ كلمة السر</span>';
      return;
    }
    // Success
    hide('formState');
    show('successState');
    setTimeout(function(){
      window.location.href = '/';
    }, 2500);
  } catch(e){
    showMsg('خطأ في الاتصال', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check"></i><span>حفظ كلمة السر</span>';
  }
}

/* ============ Session Check ============ */
(async function init(){
  try {
    // 1) نفحص لو في access_token في الرابط
    var hash = window.location.hash;
    var query = window.location.search;

    // Supabase يعالج الـ token تلقائياً، فقط نحتاج ننتظر
    var {data, error} = await sb.auth.getSession();

    // بعد فترة قصيرة، نفحص لو المستخدم عنده جلسة recovery
    setTimeout(async function(){
      var session = await sb.auth.getSession();
      var user = session.data && session.data.session && session.data.session.user;

      if(error || !user){
        // ما فيه جلسة
        hide('loadingState');
        show('errorState');
        return;
      }

      // فيه جلسة → نعرض الفورم
      hide('loadingState');
      show('formState');
      setTimeout(function(){
        document.getElementById('newPass').focus();
      }, 200);
    }, 500);

  } catch(e){
    hide('loadingState');
    show('errorState');
  }
})();

/* ============ Handle Recovery Event ============ */
sb.auth.onAuthStateChange(function(event, session){
  if(event === 'PASSWORD_RECOVERY' && session){
    hide('loadingState');
    show('formState');
  }
});

/* ============ Enter to submit ============ */
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !document.getElementById('formState').classList.contains('hidden')){
    updatePass();
  }
});
</script>
</body>
</html>
