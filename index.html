<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِذكَرتي — مدير الدراسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --orange:#FF7A00;
  --orange-dark:#E65100;
  --orange-light:#FFB74D;
  --orange-glow:rgba(255,122,0,.15);
  --bg:#1A1A1A;
  --bg2:#212121;
  --card:#262626;
  --card2:#2E2E2E;
  --text:#F5F5F5;
  --muted:#9E9E9E;
  --border:#333333;
  --green:#4CAF50;
  --yellow:#FFC107;
  --blue:#2196F3;
  --red:#F44336;
  --gray:#9E9E9E;
  --font: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
}
body.light{
  --bg:#FFF8F0; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#FFF1E0;
  --text:#1A1A1A; --muted:#666; --border:#FFE0B2;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(45deg, var(--orange-glow) 0px, var(--orange-glow) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(-45deg, var(--orange-glow) 0px, var(--orange-glow) 1px, transparent 1px, transparent 24px);
  color:var(--text);height:100vh;overflow:hidden;transition:.3s;
  font-family:var(--font);font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,strong,.btn,.tab,.stat-card .num{font-family:var(--font);font-weight:700}
.app{display:flex;height:100vh}

/* Login */
#loginScreen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#1A1A1A,#262626);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;z-index:1000;
  font-family:'Tajawal',sans-serif;
}
#loginScreen i.logo-icon{font-size:90px;color:#FF7A00}
#loginScreen h1{color:#FF7A00;font-size:36px;font-weight:800;margin:0}
#loginScreen p{color:#9E9E9E;font-size:15px;margin:0;text-align:center;max-width:400px;line-height:1.7}
.google-btn{
  background:#fff;color:#333;border:none;padding:14px 28px;border-radius:12px;
  font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-family:'Tajawal',sans-serif;
  box-shadow:0 8px 30px rgba(0,0,0,.4);transition:.2s;
}
.google-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,122,0,.3)}

/* Sidebar */
.sidebar{
  width:290px;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;transition:.3s;
}
.sidebar.hidden{width:0;overflow:hidden;padding:0;border:none}
.sidebar-header{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header i{color:var(--orange);font-size:22px}
.sidebar-header h1{font-size:19px;color:var(--orange);font-weight:800}
.user-info{padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;overflow:hidden}
.user-info img{width:24px;height:24px;border-radius:50%}
.user-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{padding:10px 14px;border-bottom:1px solid var(--border);position:relative}
.search i{position:absolute;right:26px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);outline:none;font-size:13px;font-family:var(--font);
}
.search input:focus{border-color:var(--orange)}
.subjects{flex:1;overflow-y:auto;padding:8px}
.subject{margin-bottom:6px}
.subject-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 11px;border-radius:10px;cursor:pointer;user-select:none;transition:.2s;
}
.subject-head:hover{background:var(--card)}
.subject-head .name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.subject-head .name i{color:var(--orange)}
.subject-head .actions{opacity:0;transition:.2s;display:flex;gap:8px}
.subject-head:hover .actions{opacity:1}
.subject-head .actions i{color:var(--orange);cursor:pointer;font-size:13px}
.lessons{margin-right:14px;margin-top:2px}
.lesson{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;
  cursor:pointer;font-size:13px;transition:.2s;font-weight:500;
}
.lesson:hover{background:var(--card)}
.lesson.active{background:var(--orange);color:#fff}
.lesson.active .dot{background:#fff !important}
.lesson .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .del{opacity:0;color:var(--red);font-size:13px;transition:.2s}
.lesson:hover .del{opacity:.8}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.new{background:var(--gray)}
.dot.reading{background:var(--yellow)}
.dot.partial{background:var(--blue)}
.dot.memorized{background:var(--green)}
.dot.needs_review{background:var(--red)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  padding:12px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:var(--bg2);
}
.menu-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}
.topbar .title{flex:1;font-weight:700;font-size:15px}
.icon-btn{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:8px 11px;border-radius:10px;cursor:pointer;font-size:14px;transition:.2s;
  position:relative;
}
.icon-btn:hover{border-color:var(--orange);color:var(--orange)}
.icon-btn .badge{
  position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;
  font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700;min-width:18px;text-align:center;
}
.icon-btn .badge.hidden{display:none}

.notif-panel{
  position:fixed;top:60px;left:20px;width:340px;max-height:500px;overflow-y:auto;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:150;
  transform:translateY(-10px);opacity:0;pointer-events:none;transition:.25s;
}
.notif-panel.show{transform:translateY(0);opacity:1;pointer-events:auto}
.notif-head{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--card);z-index:2;
}
.notif-head h4{font-size:15px;color:var(--orange);display:flex;align-items:center;gap:8px}
.notif-head .clear-all{
  background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--font);
}
.notif-head .clear-all:hover{color:var(--red)}
.notif-list{padding:8px}
.notif-item{
  padding:10px 12px;border-radius:10px;margin-bottom:6px;
  display:flex;gap:10px;align-items:flex-start;
  background:var(--bg);border-right:3px solid var(--orange);
  transition:.2s;cursor:pointer;
}
.notif-item:hover{background:var(--card2)}
.notif-item.read{opacity:.55;border-right-color:var(--muted)}
.notif-item.exam{border-right-color:var(--red)}
.notif-item.review{border-right-color:var(--blue)}
.notif-item.memory{border-right-color:var(--green)}
.notif-item i{color:var(--orange);font-size:15px;margin-top:2px}
.notif-item.exam i{color:var(--red)}
.notif-item.review i{color:var(--blue)}
.notif-item.memory i{color:var(--green)}
.notif-item .body{flex:1;font-size:13px;line-height:1.5}
.notif-item .body strong{display:block;margin-bottom:2px;font-weight:700}
.notif-item .body .time{font-size:11px;color:var(--muted);margin-top:3px}
.notif-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.notif-empty i{font-size:32px;display:block;margin-bottom:8px;opacity:.5}

.content{flex:1;overflow-y:auto;padding:24px}

.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--muted);text-align:center;gap:14px;
}
.empty i{font-size:60px;color:var(--orange);opacity:.5}
.empty h2{font-size:22px;color:var(--text);font-weight:700}
.empty p{font-size:14px;max-width:420px;line-height:1.7}

.lesson-view{max-width:850px;margin:0 auto}
.lesson-view h2{font-size:24px;margin-bottom:6px;color:var(--orange);font-weight:800}
.lesson-view .meta{color:var(--muted);font-size:13px;margin-bottom:20px}
.section{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;margin-bottom:16px;
}
.section h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--orange);font-weight:700}
.status-btns{display:flex;flex-wrap:wrap;gap:8px}
.status-btn{
  padding:9px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;
  transition:.2s;display:flex;align-items:center;gap:6px;font-family:var(--font);font-weight:500;
}
.status-btn:hover{border-color:var(--orange)}
.status-btn.active{border-color:var(--orange);background:var(--orange);color:#fff}

.feynman-area textarea{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);outline:none;font-size:14px;
  font-family:var(--font);min-height:110px;resize:vertical;line-height:1.7;
}
.feynman-area textarea:focus{border-color:var(--orange)}
.feynman-result{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;display:none;line-height:1.6}
.feynman-result.show{display:block}
.feynman-result.good{background:rgba(76,175,80,.15);color:#81C784;border:1px solid rgba(76,175,80,.4)}
.feynman-result.bad{background:rgba(244,67,54,.15);color:#EF9A9A;border:1px solid rgba(244,67,54,.4)}

.cards-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.card-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  background:var(--bg);border-radius:10px;font-size:13px;border:1px solid var(--border);
}
.card-item .q{flex:1}
.card-item .lvl{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.lvl-1{background:rgba(244,67,54,.2);color:#EF9A9A}
.lvl-2{background:rgba(255,193,7,.2);color:#FFD54F}
.lvl-3{background:rgba(76,175,80,.2);color:#81C784}
.card-item .del{color:var(--red);cursor:pointer;opacity:.6}
.card-item .del:hover{opacity:1}

.sched{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sched-item{
  padding:7px 13px;border-radius:20px;font-size:12px;
  background:var(--bg);border:1px solid var(--border);font-weight:500;
}
.sched-item.done{background:rgba(76,175,80,.15);border-color:var(--green);color:#81C784}
.sched-item.due{background:rgba(255,122,0,.15);border-color:var(--orange);color:var(--orange)}

.btn{
  padding:10px 18px;border:none;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font);
}
.btn-primary{background:linear-gradient(90deg,var(--orange),var(--orange-dark));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:8px 14px;font-size:12px}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:22px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
}
.modal h3{margin-bottom:16px;font-size:18px;color:var(--orange);display:flex;align-items:center;gap:8px;font-weight:700}
.modal label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:12px}
.modal input,.modal select,.modal textarea{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);outline:none;font-size:14px;font-family:var(--font);
}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--orange)}
.modal textarea{min-height:80px;resize:vertical;line-height:1.7}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.icon-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.icon-picker i{
  padding:12px;text-align:center;border:1px solid var(--border);border-radius:10px;
  cursor:pointer;font-size:18px;color:var(--muted);transition:.2s;
}
.icon-picker i:hover{border-color:var(--orange);color:var(--orange)}
.icon-picker i.selected{background:var(--orange);color:#fff;border-color:var(--orange)}

.perm-banner{
  background:linear-gradient(90deg,var(--orange),var(--orange-dark));
  color:#fff;padding:12px 18px;border-radius:10px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  font-size:13px;
}
.perm-banner button{
  background:#fff;color:var(--orange-dark);border:none;padding:7px 14px;
  border-radius:8px;cursor:pointer;font-weight:700;font-family:var(--font);font-size:12px;
}

.fc-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;
  align-items:center;justify-content:center;z-index:200;padding:20px;flex-direction:column;
}
.fc-overlay.show{display:flex}
.fc{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:40px 30px;max-width:540px;width:100%;text-align:center;min-height:280px;
  display:flex;flex-direction:column;justify-content:center;gap:20px;
}
.fc .q{font-size:21px;font-weight:700;line-height:1.7}
.fc .a{font-size:16px;color:var(--muted);padding-top:20px;border-top:1px dashed var(--border);margin-top:20px;line-height:1.7}
.fc-progress{color:var(--muted);font-size:13px;margin-bottom:14px}
.fc-actions{display:flex;gap:10px;margin-top:24px;justify-content:center;flex-wrap:wrap}
.rate-1{background:#dc2626;color:#fff}
.rate-2{background:#eab308;color:#000}
.rate-3{background:#22c55e;color:#fff}
.close-x{
  position:absolute;top:20px;left:20px;background:none;border:none;
  color:#fff;font-size:28px;cursor:pointer;
}

.pomo-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;
  align-items:center;justify-content:center;z-index:200;flex-direction:column;
}
.pomo-overlay.show{display:flex}
.pomo{text-align:center;color:#fff}
.pomo .time{font-size:96px;font-weight:800;color:var(--orange);letter-spacing:4px;font-family:var(--font)}
.pomo .phase{font-size:20px;color:var(--muted);margin-bottom:20px}
.pomo .controls{display:flex;gap:12px;margin-top:30px;justify-content:center}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.cal-day{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px;min-height:120px;font-size:12px;
}
.cal-day .dname{font-weight:800;color:var(--orange);margin-bottom:6px;font-size:13px}
.cal-item{
  background:rgba(255,122,0,.15);border-right:3px solid var(--orange);
  padding:5px 7px;border-radius:6px;margin-bottom:4px;font-size:11px;line-height:1.5;
}
.cal-item.exam{background:rgba(244,67,54,.15);border-color:var(--red)}
.cal-item.review{background:rgba(33,150,243,.15);border-color:var(--blue)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;text-align:center;
}
.stat-card i{font-size:28px;color:var(--orange);margin-bottom:10px}
.stat-card .num{font-size:30px;font-weight:800;color:var(--orange)}
.stat-card .lbl{font-size:13px;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:6px;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{
  padding:13px 16px;cursor:pointer;font-size:13px;color:var(--muted);
  border-bottom:2px solid transparent;transition:.2s;display:flex;align-items:center;gap:6px;
  white-space:nowrap;font-weight:600;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}

.toast{
  position:fixed;bottom:20px;left:20px;background:var(--orange);color:#fff;
  padding:13px 20px;border-radius:12px;font-size:14px;z-index:300;
  transform:translateY(100px);opacity:0;transition:.3s;
  display:flex;align-items:center;gap:10px;font-weight:600;
  box-shadow:0 8px 30px rgba(255,122,0,.4);
}
.toast.show{transform:translateY(0);opacity:1}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--orange)}

@media(max-width:768px){
  .sidebar{position:fixed;right:0;top:0;height:100vh;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.5)}
  .cal-grid{grid-template-columns:1fr 1fr}
  .lesson-view h2{font-size:20px}
  .notif-panel{width:calc(100vw - 40px);left:20px}
}
</style>
</head>
<body>

<!-- ========== Login Screen ========== -->
<div id="loginScreen">
  <i class="fa-solid fa-graduation-cap logo-icon"></i>
  <h1>مِذكَرتي</h1>
  <p>نظّم دروسك، احفظ بذكاء، وتابع تقدمك</p>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    تسجيل الدخول بجوجل
  </button>
</div>

<div class="app" id="appContainer" style="display:none">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="fa-solid fa-graduation-cap"></i>
      <h1>مِذكَرتي</h1>
    </div>
    <div class="user-info" id="userInfo"></div>
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="بحث عن درس...">
    </div>
    <div class="subjects" id="subjectsList"></div>
    <div class="sidebar-footer">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="openSubjectModal()">
        <i class="fa-solid fa-plus"></i> إضافة مادة
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="title" id="topTitle">اختر درساً من القائمة</div>
      <button class="icon-btn" onclick="toggleNotifPanel()" title="الإشعارات">
        <i class="fa-solid fa-bell"></i>
        <span class="badge hidden" id="notifBadge">0</span>
      </button>

<script>
/* =====================================================
   SUPABASE CONFIG
===================================================== */
const SUPABASE_URL = 'https://ncrycgbrstafdouvipzc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

/* ============ Auth ============ */
async function signInWithGoogle() {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if (error) alert('خطأ: ' + error.message);
}

async function signOut() {
  await supabase.auth.signOut();
  location.reload();
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appContainer').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
}

function renderUserInfo(user) {
  const info = document.getElementById('userInfo');
  const avatar = user.user_metadata?.avatar_url || '';
  const name = user.user_metadata?.full_name || user.email || 'مستخدم';
  info.innerHTML = `
    ${avatar ? `<img src="${avatar}" alt="">` : '<i class="fa-solid fa-user" style="color:var(--orange)"></i>'}
    <span>${name}</span>
  `;
}

supabase.auth.onAuthStateChange(async (event, session) => {
  if (session && session.user) {
    currentUser = session.user;
    showApp();
    renderUserInfo(session.user);
    await loadAllData();
  } else {
    currentUser = null;
    showLogin();
  }
});

/* =====================================================
   STATE
===================================================== */
let state = {subjects:[], schedule:[], notifications:[], theme:'dark'};
let currentLessonId = null, currentSubjectId = null, tempSubjectId = null;
let currentTab = 'study';
let selectedIcon = 'fa-book';
let fcQueue = [], fcIndex = 0, fcFlipped = false;
let pomoInterval = null, pomoTime = 25*60, pomoRunning = false, pomoPhase = 'focus';
let notifCheckInterval = null;

const ICONS = ['fa-calculator','fa-atom','fa-flask','fa-book-open','fa-language','fa-spell-check','fa-landmark','fa-globe','fa-mosque','fa-scale-balanced','fa-dna','fa-earth-africa','fa-palette','fa-music','fa-laptop-code'];
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const SPACED_INTERVALS = [1, 3, 7, 21];

/* ============ Helpers ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg, icon='fa-circle-check'){
  const t = document.getElementById('toast');
  t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ar-DZ'); }
function timeAgo(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m < 1) return 'الآن';
  if(m < 60) return `قبل ${m} دقيقة`;
  const h = Math.floor(m/60);
  if(h < 24) return `قبل ${h} ساعة`;
  const d = Math.floor(h/24);
  return `قبل ${d} يوم`;
}

/* =====================================================
   LOAD DATA FROM SUPABASE
===================================================== */
async function loadAllData() {
  if (!currentUser) return;

  const [s, l, c, sc, n] = await Promise.all([
    supabase.from('subjects').select('*').order('created_at'),
    supabase.from('lessons').select('*'),
    supabase.from('cards').select('*'),
    supabase.from('schedule').select('*'),
    supabase.from('notifications').select('*').order('created_at', {ascending:false}).limit(100)
  ]);

  state.subjects = (s.data || []).map(sub => ({
    id: sub.id,
    name: sub.name,
    icon: sub.icon || 'fa-book',
    lessons: (l.data || []).filter(x => x.subject_id === sub.id).map(les => ({
      id: les.id,
      title: les.title,
      status: les.status || 'new',
      date: les.lesson_date,
      feynman: { done: les.feynman_done || false, text: les.feynman_text || '' },
      spaced: {
        stage: les.spaced_stage || 0,
        history: les.spaced_history || [],
        nextReview: les.spaced_next_review ? new Date(les.spaced_next_review).getTime() : null,
        notified: null
      },
      cards: (c.data || []).filter(x => x.lesson_id === les.id).map(cd => ({
        id: cd.id,
        q: cd.q,
        a: cd.a,
        level: cd.level || 2,
        nextReview: cd.next_review ? new Date(cd.next_review).getTime() : Date.now()
      }))
    }))
  }));

  state.schedule = (sc.data || []).map(x => ({
    id: x.id, type: x.type, day: x.day, title: x.title, time: x.time
  }));

  state.notifications = (n.data || []).map(x => ({
    id: x.id, type: x.type, title: x.title, body: x.body,
    time: new Date(x.created_at).getTime(), read: x.read
  }));

  renderSubjects();
  renderContent();
  renderNotifBadge();
  renderNotifList();
}

/* =====================================================
   NOTIFICATIONS
===================================================== */
function requestNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default') Notification.requestPermission();
}

async function pushNotif(type, title, body, opts={}){
  if(!currentUser) return;
  const { data } = await supabase.from('notifications').insert({
    user_id: currentUser.id,
    type, title, body, read: false
  }).select().single();

  if(data){
    state.notifications.unshift({
      id: data.id, type, title, body,
      time: new Date(data.created_at).getTime(), read: false
    });
    renderNotifBadge();
    renderNotifList();
  }

  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, {body, icon:'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FF7A00"/><text x="50" y="68" font-size="60" text-anchor="middle" fill="white">📚</text></svg>'});
      setTimeout(()=>n.close(), 6000);
    }catch(e){}
  }

  const icon = type === 'exam' ? 'fa-file-pen' : type === 'review' ? 'fa-rotate' : type === 'memory' ? 'fa-brain' : 'fa-bell';
  toast(`${title} — ${body}`, icon);
}

function renderNotifBadge(){
  const unread = (state.notifications || []).filter(n => !n.read).length;
  const badge = document.getElementById('notifBadge');
  if(unread > 0){
    badge.textContent = unread > 99 ? '99+' : unread;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function renderNotifList(){
  const list = document.getElementById('notifList');
  if(!list) return;
  const notifs = state.notifications || [];
  if(notifs.length === 0){
    list.innerHTML = `<div class="notif-empty"><i class="fa-solid fa-bell-slash"></i>لا إشعارات بعد</div>`;
    return;
  }
  list.innerHTML = notifs.slice(0, 20).map(n => {
    const icon = n.type === 'exam' ? 'fa-file-pen' :
                 n.type === 'review' ? 'fa-rotate' :
                 n.type === 'memory' ? 'fa-brain' :
                 n.type === 'study' ? 'fa-lightbulb' : 'fa-bell';
    const cls = n.type === 'exam' ? 'exam' :
                n.type === 'review' ? 'review' :
                n.type === 'memory' ? 'memory' : '';
    return `
      <div class="notif-item ${n.read?'read':''} ${cls}" onclick="markNotifRead('${n.id}')">
        <i class="fa-solid ${icon}"></i>
        <div class="body">
          <strong>${escapeHtml(n.title)}</strong>
          ${escapeHtml(n.body)}
          <div class="time"><i class="fa-regular fa-clock"></i> ${timeAgo(n.time)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function markNotifRead(id){
  await supabase.from('notifications').update({read:true}).eq('id', id);
  const n = state.notifications.find(x => x.id === id);
  if(n) n.read = true;
  renderNotifBadge();
  renderNotifList();
}

function toggleNotifPanel(){
  const p = document.getElementById('notifPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show')) renderNotifList();
}

async function clearAllNotifs(){
  if(!confirm('مسح كل الإشعارات؟')) return;
  await supabase.from('notifications').delete().eq('user_id', currentUser.id);
  state.notifications = [];
  renderNotifBadge();
  renderNotifList();
}

function checkDueReminders(){
  // Simplified - runs client side and creates notifs once per session
  const now = Date.now();
  let changed = false;
  state.subjects.forEach(s => {
    s.lessons.forEach(l => {
      if(l.spaced && l.spaced.nextReview && l.spaced.nextReview <= now){
        const key = 'sp_' + l.id + '_' + l.spaced.stage;
        if(!l.spaced.notified || l.spaced.notified !== key){
          pushNotif('review', 'مراجعة مستحقة', `${s.name}: ${l.title}`);
          l.spaced.notified = key;
          changed = true;
        }
      }
    });
  });
}

/* =====================================================
   THEME
===================================================== */
function applyTheme(){
  document.body.classList.toggle('light', state.theme === 'light');
  document.getElementById('themeBtn').innerHTML = state.theme === 'light'
    ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
}
function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme();
}

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }

/* =====================================================
   ICON PICKER
===================================================== */
function renderIconPicker(){
  const p = document.getElementById('iconPicker');
  p.innerHTML = ICONS.map(ic =>
    `<i class="fa-solid ${ic} ${ic===selectedIcon?'selected':''}" onclick="pickIcon('${ic}')"></i>`
  ).join('');
}
function pickIcon(ic){ selectedIcon = ic; renderIconPicker(); }

/* =====================================================
   SUBJECTS - CRUD
===================================================== */
function openSubjectModal(){
  document.getElementById('subjectName').value = '';
  selectedIcon = 'fa-book';
  renderIconPicker();
  openModal('subjectModal');
}

async function addSubject(){
  const name = document.getElementById('subjectName').value.trim();
  if(!name){ toast('اكتب اسم المادة','fa-triangle-exclamation'); return; }

  const { data, error } = await supabase.from('subjects').insert({
    user_id: currentUser.id,
    name, icon: selectedIcon
  }).select().single();

  if(error){ toast('خطأ: ' + error.message, 'fa-triangle-exclamation'); return; }

  state.subjects.push({ id: data.id, name: data.name, icon: data.icon, lessons: [] });
  closeModal('subjectModal');
  renderSubjects();
  pushNotif('info', 'مادة جديدة', name);
}

async function deleteSubject(id){
  if(!confirm('حذف المادة وكل دروسها؟')) return;
  await supabase.from('subjects').delete().eq('id', id);
  state.subjects = state.subjects.filter(s=>s.id!==id);
  if(currentSubjectId===id){ currentLessonId=null; currentSubjectId=null; }
  renderSubjects(); renderContent();
}

function openLessonModal(subjectId){
  tempSubjectId = subjectId;
  document.getElementById('lessonTitle').value = '';
  document.getElementById('lessonDate').value = '';
  openModal('lessonModal');
}

async function addLesson(){
  const title = document.getElementById('lessonTitle').value.trim();
  const date = document.getElementById('lessonDate').value;
  if(!title){ toast('اكتب عنوان الدرس','fa-triangle-exclamation'); return; }

  const nextReview = new Date(Date.now() + SPACED_INTERVALS[0]*24*60*60*1000).toISOString();

  const { data, error } = await supabase.from('lessons').insert({
    subject_id: tempSubjectId,
    user_id: currentUser.id,
    title,
    status: 'new',
    feynman_done: false,
    feynman_text: '',
    spaced_stage: 0,
    spaced_history: [],
    spaced_next_review: nextReview,
    lesson_date: date || null
  }).select().single();

  if(error){ toast('خطأ: ' + error.message, 'fa-triangle-exclamation'); return; }

  const s = state.subjects.find(x=>x.id===tempSubjectId);
  if(s){
    s.lessons.push({
      id: data.id, title: data.title, status: 'new', date: date || null,
      feynman: { done: false, text: '' },
      spaced: { stage: 0, history: [], nextReview: new Date(nextReview).getTime(), notified: null },
      cards: []
    });
  }
  closeModal('lessonModal'); renderSubjects();
  pushNotif('study', 'درس جديد', `${s.name}: ${title}`);
}

async function deleteLesson(sid, lid){
  if(!confirm('حذف الدرس؟')) return;
  await supabase.from('lessons').delete().eq('id', lid);
  const s = state.subjects.find(x=>x.id===sid);
  if(s) s.lessons = s.lessons.filter(l=>l.id!==lid);
  if(currentLessonId===lid){ currentLessonId=null; renderContent(); }
  renderSubjects();
}

/* =====================================================
   RENDER SIDEBAR
===================================================== */
function renderSubjects(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('subjectsList');
  list.innerHTML = '';
  state.subjects.forEach(s=>{
    const filtered = s.lessons.filter(l=> l.title.toLowerCase().includes(q));
    if(q && filtered.length===0 && !s.name.toLowerCase().includes(q)) return;

    const div = document.createElement('div');
    div.className = 'subject';
    div.innerHTML = `
      <div class="subject-head" onclick="toggleSubject(this)">
        <div class="name"><i class="fa-solid ${s.icon}"></i> ${s.name}</div>
        <div class="actions">
          <i class="fa-solid fa-plus" onclick="event.stopPropagation();openLessonModal('${s.id}')" title="إضافة درس"></i>
          <i class="fa-solid fa-trash" onclick="event.stopPropagation();deleteSubject('${s.id}')" title="حذف"></i>
        </div>
      </div>
      <div class="lessons">
        ${filtered.map(l=>`
          <div class="lesson ${currentLessonId===l.id?'active':''}" onclick="openLesson('${s.id}','${l.id}')">
            <span class="dot ${l.status}"></span>
            <span class="title">${escapeHtml(l.title)}</span>
            <i class="fa-solid fa-xmark del" onclick="event.stopPropagation();deleteLesson('${s.id}','${l.id}')"></i>
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(div);
  });
}
function toggleSubject(el){
  const lessons = el.nextElementSibling;
  lessons.style.display = lessons.style.display === 'none' ? 'block' : 'none';
}

/* =====================================================
   TABS
===================================================== */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===tab));
  renderContent();
}

function openLesson(sid, lid){
  currentSubjectId = sid; currentLessonId = lid;
  if(currentTab !== 'study') switchTab('study');
  renderSubjects(); renderContent();
}

/* =====================================================
   RENDER CONTENT
===================================================== */
const statusLabels = {
  new:{l:'جديد', i:'fa-circle', c:'new'},
  reading:{l:'قيد الفهم', i:'fa-book-open-reader', c:'reading'},
  partial:{l:'محفوظ جزئي', i:'fa-circle-half-stroke', c:'partial'},
  memorized:{l:'محفوظ', i:'fa-circle-check', c:'memorized'},
  needs_review:{l:'يحتاج مراجعة', i:'fa-rotate', c:'needs_review'}
};

function renderContent(){
  const content = document.getElementById('content');
  const titleEl = document.getElementById('topTitle');

  if(currentTab === 'calendar') return renderCalendar(content, titleEl);
  if(currentTab === 'schedule') return renderSchedule(content, titleEl);
  if(currentTab === 'stats') return renderStats(content, titleEl);
  if(currentTab === 'notifs') return renderNotifsTab(content, titleEl);

  if(!currentLessonId){
    titleEl.textContent = 'اختر درساً من القائمة';
    content.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>أهلاً بك في مِذكَرتي</h2>
        <p>أضف مادة من السايد بار، ثم أضف دروسك. لكل درس: نظام فهم (فاينمان) + نظام حفظ (بطاقات + تكرار متباعد).</p>
      </div>`;
    return;
  }

  const s = state.subjects.find(x=>x.id===currentSubjectId);
  const l = s?.lessons.find(x=>x.id===currentLessonId);
  if(!l){ currentLessonId=null; renderContent(); return; }

  titleEl.textContent = `${s.name} — ${l.title}`;

  const now = Date.now();
  const due = l.cards.filter(c=> !c.nextReview || c.nextReview <= now).length;
  const spaced = l.spaced || {stage:0, history:[]};

  const spacedHtml = SPACED_INTERVALS.map((days, i) => {
    const done = spaced.history && spaced.history[i];
    const dueNow = !done && (i===0 || (spaced.history && spaced.history[i-1])) && spaced.stage === i;
    const cls = done ? 'done' : (dueNow ? 'due' : '');
    const icon = done ? 'fa-check' : (dueNow ? 'fa-clock' : 'fa-circle');
    return `<div class="sched-item ${cls}"><i class="fa-solid ${icon}"></i> J+${days}</div>`;
  }).join('');

  const permBanner = (('Notification' in window) && Notification.permission === 'default') ? `
    <div class="perm-banner">
      <span><i class="fa-solid fa-bell"></i> فعّل إشعارات المتصفح لتصلك تنبيهات المراجعة.</span>
      <button onclick="requestNotifPermission()">تفعيل</button>
    </div>` : '';

  content.innerHTML = `
    <div class="lesson-view">
      ${permBanner}
      <h2><i class="fa-solid ${s.icon}"></i> ${escapeHtml(l.title)}</h2>
      <div class="meta">${s.name} · ${l.cards.length} بطاقة</div>

      <div class="section">
        <h3><i class="fa-solid fa-signal"></i> حالة الدرس</h3>
        <div class="status-btns">
          ${Object.entries(statusLabels).map(([k,v])=>`
            <button class="status-btn ${l.status===k?'active':''}" onclick="setStatus('${k}')">
              <i class="fa-solid ${v.i}"></i> ${v.l}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="section">
        <h3><i class="fa-solid fa-lightbulb"></i> نظام الفهم — تقنية فاينمان</h3>
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.7">
          اشرح الدرس بكلماتك البسيطة، كأنك تدرّس طالباً لا يعرفه.
        </p>
        <div class="feynman-area">
          <textarea id="feynmanText" placeholder="اشرح الدرس هنا...">${escapeHtml((l.feynman && l.feynman.text) || '')}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="checkFeynman()"><i class="fa-solid fa-brain"></i> اختبر فهمي</button>
            <button class="btn btn-ghost btn-sm" onclick="saveFeynman()"><i class="fa-solid fa-floppy-disk"></i> حفظ الشرح</button>
            ${l.feynman && l.feynman.done ? '<span class="sched-item done"><i class="fa-solid fa-check"></i> تم الفهم</span>' : ''}
          </div>
          <div class="feynman-result" id="feynmanResult"></div>
        </div>
      </div>

      <div class="section">
        <h3><i class="fa-solid fa-layer-group"></i> نظام الحفظ — بطاقات (${l.cards.length})</h3>
        <div class="cards-list">
          ${l.cards.length===0 ? '<p style="color:var(--muted);font-size:13px">لا توجد بطاقات بعد.</p>' :
            l.cards.map(c=>`
              <div class="card-item">
                <span class="q">${escapeHtml(c.q)}</span>
                <span class="lvl lvl-${c.level}">${['','صعب','متوسط','سهل'][c.level]}</span>
                <i class="fa-solid fa-trash del" onclick="deleteCard('${c.id}')"></i>
              </div>
            `).join('')}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" onclick="openCardModal()"><i class="fa-solid fa-plus"></i> إضافة بطاقة</button>
          ${l.cards.length>0 ? `<button class="btn btn-primary btn-sm" onclick="startFlashcards()"><i class="fa-solid fa-play"></i> مراجعة (${due} مستحقة)</button>` : ''}
        </div>
      </div>

      <div class="section">
        <h3><i class="fa-solid fa-rotate"></i> التكرار المتباعد</h3>
        <div class="sched">${spacedHtml}</div>
        ${spaced.nextReview ? `<p style="font-size:12px;color:var(--orange);margin-top:10px"><i class="fa-solid fa-clock"></i> المراجعة القادمة: ${fmtDate(spaced.nextReview)}</p>` : ''}
        <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="markSpacedReview()">
          <i class="fa-solid fa-check"></i> أنجزت مراجعة هذه المرحلة
        </button>
      </div>
    </div>
  `;
}

async function setStatus(st){
  const l = getCurrentLesson(); if(!l) return;
  await supabase.from('lessons').update({status:st}).eq('id', l.id);
  l.status = st;
  renderSubjects(); renderContent();
  toast('تم تحديث الحالة');
}
function getCurrentLesson(){
  const s = state.subjects.find(x=>x.id===currentSubjectId);
  return s?.lessons.find(x=>x.id===currentLessonId);
}

/* =====================================================
   FEYNMAN
===================================================== */
async function saveFeynman(){
  const l = getCurrentLesson(); if(!l) return;
  const txt = document.getElementById('feynmanText').value.trim();
  await supabase.from('lessons').update({feynman_text:txt}).eq('id', l.id);
  l.feynman = l.feynman || {done:false, text:''};
  l.feynman.text = txt;
  toast('تم حفظ الشرح');
}

async function checkFeynman(){
  const l = getCurrentLesson(); if(!l) return;
  const txt = document.getElementById('feynmanText').value.trim();
  const res = document.getElementById('feynmanResult');
  if(txt.length < 30){
    res.className = 'feynman-result show bad';
    res.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> الشرح قصير جداً — اكتب أكثر.';
    return;
  }
  const words = txt.split(/\s+/).length;
  const hasExamples = /مثال|مثلا|مثل|يعني|كأن|تقريبا/.test(txt);
  const hasSimple = /بسيط|سهل|يعني|كأن|هو|هي/.test(txt);
  const score = (words>50?1:0) + (hasExamples?1:0) + (hasSimple?1:0);

  if(score >= 2){
    res.className = 'feynman-result show good';
    res.innerHTML = '<i class="fa-solid fa-circle-check"></i> ممتاز! شرحت بأسلوب مبسّط ومفصل.';
    await supabase.from('lessons').update({feynman_done:true, feynman_text:txt}).eq('id', l.id);
    l.feynman = {done:true, text:txt};
    if(l.status === 'new' || l.status === 'reading') { l.status = 'reading'; await supabase.from('lessons').update({status:'reading'}).eq('id', l.id); }
    renderSubjects();
    pushNotif('study', 'أحسنت! فهمت درساً', l.title);
  } else {
    res.className = 'feynman-result show bad';
    res.innerHTML = '<i class="fa-solid fa-lightbulb"></i> حاول تبسّط أكثر مع أمثلة.';
  }
}

/* =====================================================
   CARDS
===================================================== */
function openCardModal(){
  document.getElementById('cardQ').value = '';
  document.getElementById('cardA').value = '';
  openModal('cardModal');
}
async function addCard(){
  const q = document.getElementById('cardQ').value.trim();
  const a = document.getElementById('cardA').value.trim();
  if(!q || !a){ toast('املأ السؤال والجواب','fa-triangle-exclamation'); return; }
  const l = getCurrentLesson(); if(!l) return;

  const { data, error } = await supabase.from('cards').insert({
    lesson_id: l.id, user_id: currentUser.id, q, a, level: 2,
    next_review: new Date().toISOString()
  }).select().single();

  if(error){ toast('خطأ: ' + error.message, 'fa-triangle-exclamation'); return; }

  l.cards.push({id: data.id, q, a, level: 2, nextReview: Date.now()});
  closeModal('cardModal'); renderContent();
  pushNotif('memory', 'بطاقة حفظ جديدة', q);
}

async function deleteCard(cid){
  await supabase.from('cards').delete().eq('id', cid);
  const l = getCurrentLesson(); if(!l) return;
  l.cards = l.cards.filter(c=>c.id!==cid);
  renderContent();
}

/* =====================================================
   FLASHCARDS
===================================================== */
function startFlashcards(){
  const l = getCurrentLesson();
  if(!l || l.cards.length===0) return;
  const now = Date.now();
  fcQueue = l.cards.filter(c=> !c.nextReview || c.nextReview <= now);
  if(fcQueue.length===0) fcQueue = [...l.cards];
  fcQueue.sort(()=>Math.random()-0.5);
  fcIndex = 0; fcFlipped = false;
  document.getElementById('fcOverlay').classList.add('show');
  renderFlashcard();
}
function renderFlashcard(){
  const box = document.getElementById('fcBox');
  const prog = document.getElementById('fcProgress');
  if(fcIndex >= fcQueue.length){
    box.innerHTML = `<div class="q">🎉 خلصت المراجعة!</div><div class="a">راجعت ${fcQueue.length} بطاقة</div>`;
    prog.textContent = '';
    setTimeout(closeFlashcards, 1500);
    return;
  }
  const c = fcQueue[fcIndex];
  prog.textContent = `بطاقة ${fcIndex+1} من ${fcQueue.length}`;
  if(!fcFlipped){
    box.innerHTML = `<div class="q">${escapeHtml(c.q)}</div>
      <div class="fc-actions"><button class="btn btn-primary" onclick="flipCard()"><i class="fa-solid fa-eye"></i> اكشف الجواب</button></div>`;
  } else {
    box.innerHTML = `<div class="q">${escapeHtml(c.q)}</div><div class="a">${escapeHtml(c.a)}</div>
      <div class="fc-actions">
        <button class="btn rate-1" onclick="rateCard(1)"><i class="fa-solid fa-face-tired"></i> صعب</button>
        <button class="btn rate-2" onclick="rateCard(2)"><i class="fa-solid fa-face-meh"></i> متوسط</button>
        <button class="btn rate-3" onclick="rateCard(3)"><i class="fa-solid fa-face-smile"></i> سهل</button>
      </div>`;
  }
}
function flipCard(){ fcFlipped = true; renderFlashcard(); }
async function rateCard(level){
  const c = fcQueue[fcIndex];
  const l = getCurrentLesson();
  const orig = l.cards.find(x=>x.id===c.id);
  if(orig){
    orig.level = level;
    const delays = {1: 10*60*1000, 2: 24*60*60*1000, 3: 4*24*60*60*1000};
    orig.nextReview = Date.now() + delays[level];
    await supabase.from('cards').update({
      level, next_review: new Date(orig.nextReview).toISOString()
    }).eq('id', orig.id);
  }
  fcIndex++; fcFlipped = false;
  renderFlashcard();
}
function closeFlashcards(){
  document.getElementById('fcOverlay').classList.remove('show');
  renderContent(); renderSubjects();
}

/* =====================================================
   SPACED REPETITION
===================================================== */
async function markSpacedReview(){
  const l = getCurrentLesson(); if(!l) return;
  const idx = l.spaced.stage;
  if(idx >= SPACED_INTERVALS.length){ toast('أكملت كل المراجعات','fa-check'); return; }
  l.spaced.history[idx] = Date.now();
  l.spaced.stage = idx + 1;
  let nextReview = null;
  let newStatus = l.status;
  if(idx+1 < SPACED_INTERVALS.length){
    nextReview = new Date(Date.now() + SPACED_INTERVALS[idx+1]*24*60*60*1000).toISOString();
    l.spaced.nextReview = new Date(nextReview).getTime();
  } else {
    l.spaced.nextReview = null;
    l.status = 'memorized';
    newStatus = 'memorized';
  }
  l.spaced.notified = null;

  await supabase.from('lessons').update({
    spaced_stage: l.spaced.stage,
    spaced_history: l.spaced.history,
    spaced_next_review: nextReview,
    status: newStatus
  }).eq('id', l.id);

  renderSubjects(); renderContent();
  pushNotif('review', 'أنجزت مراجعة', l.title);
}

/* =====================================================
   SCHEDULE
===================================================== */
function renderSchedule(content, titleEl){
  titleEl.textContent = 'جدول الحصص الأسبوعي';
  const grouped = {};
  DAYS.forEach(d => grouped[d] = []);
  (state.schedule||[]).forEach(item => { if(grouped[item.day]) grouped[item.day].push(item); });

  content.innerHTML = `
    <div style="max-width:1100px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h2 style="color:var(--orange)"><i class="fa-solid fa-table"></i> جدول الأسبوع</h2>
        <button class="btn btn-primary btn-sm" onclick="openModal('schedModal')"><i class="fa-solid fa-plus"></i> إضافة حصة</button>
      </div>
      <div class="cal-grid">
        ${DAYS.map(d => `
          <div class="cal-day">
            <div class="dname">${d}</div>
            ${grouped[d].length===0 ? '<div style="color:var(--muted);font-size:11px">لا حصص</div>' :
              grouped[d].map(it => `
                <div class="cal-item ${it.type==='exam'?'exam':it.type==='review'?'review':''}">
                  <strong>${escapeHtml(it.title)}</strong>
                  ${it.time ? '<br>'+escapeHtml(it.time) : ''}
                  <i class="fa-solid fa-xmark" style="float:left;cursor:pointer;opacity:.6" onclick="delSched('${it.id}')"></i>
                </div>
              `).join('')
            }
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
async function addSched(){
  const type = document.getElementById('schedType').value;
  const day = document.getElementById('schedDay').value;
  const title = document.getElementById('schedTitle').value.trim();
  const time = document.getElementById('schedTime').value.trim();
  if(!title){ toast('اكتب العنوان','fa-triangle-exclamation'); return; }

  const { data, error } = await supabase.from('schedule').insert({
    user_id: currentUser.id, type, day, title, time
  }).select().single();

  if(error){ toast('خطأ: ' + error.message, 'fa-triangle-exclamation'); return; }

  state.schedule.push({id:data.id, type, day, title, time});
  closeModal('schedModal'); renderContent();
  const typeLabel = type==='exam'?'فرض/اختبار':type==='review'?'مراجعة':type==='memory'?'حفظ':'حصة';
  pushNotif(type, 'موعد جديد', `${typeLabel}: ${title} — ${day}`);
}
async function delSched(id){
  await supabase.from('schedule').delete().eq('id', id);
  state.schedule = state.schedule.filter(x=>x.id!==id);
  renderContent();
}

/* =====================================================
   CALENDAR
===================================================== */
function renderCalendar(content, titleEl){
  titleEl.textContent = 'التقويم والمواعيد';
  const now = Date.now();
  const upcoming = [];
  state.subjects.forEach(s => {
    s.lessons.forEach(l => {
      if(l.spaced && l.spaced.nextReview && l.spaced.nextReview > now){
        upcoming.push({type:'review', title:`مراجعة: ${l.title}`, date:l.spaced.nextReview, subj:s.name, icon:s.icon, subjectId:s.id, lessonId:l.id});
      }
    });
  });
  const today = DAYS[(new Date().getDay() + 1) % 7];
  (state.schedule||[]).filter(x=>x.type==='exam').forEach(x => {
    upcoming.push({type:'exam', title:`فرض/اختبار: ${x.title}`, date: now, subj:x.day + (x.day===today?' (اليوم)':''), icon:'fa-file-pen'});
  });

  upcoming.sort((a,b)=> a.date - b.date);

  content.innerHTML = `
    <div style="max-width:800px;margin:0 auto">
      <h2 style="color:var(--orange);margin-bottom:16px"><i class="fa-solid fa-calendar-days"></i> المواعيد القادمة</h2>
      ${upcoming.length===0 ? '<div class="empty"><i class="fa-solid fa-calendar-xmark"></i><p>لا مواعيد قادمة.</p></div>' :
        upcoming.map(u => `
          <div class="section" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer" onclick="${u.lessonId ? `openLesson('${u.subjectId}','${u.lessonId}')` : ''}">
            <i class="fa-solid ${u.icon}" style="font-size:24px;color:var(--orange)"></i>
            <div style="flex:1">
              <div style="font-weight:700">${escapeHtml(u.title)}</div>
              <div style="font-size:12px;color:var(--muted)">${escapeHtml(u.subj)} · ${fmtDate(u.date)}</div>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}

/* =====================================================
   STATS
===================================================== */
function renderStats(content, titleEl){
  titleEl.textContent = 'الإحصائيات';
  let totalLessons = 0, memorized = 0, totalCards = 0, dueCards = 0;
  const now = Date.now();
  state.subjects.forEach(s => {
    totalLessons += s.lessons.length;
    s.lessons.forEach(l => {
      if(l.status === 'memorized') memorized++;
      totalCards += l.cards.length;
      l.cards.forEach(c => { if(!c.nextReview || c.nextReview <= now) dueCards++; });
    });
  });
  const pct = totalLessons ? Math.round(memorized/totalLessons*100) : 0;

  content.innerHTML = `
    <div style="max-width:900px;margin:0 auto">
      <h2 style="color:var(--orange);margin-bottom:16px"><i class="fa-solid fa-chart-line"></i> تقدمك</h2>
      <div class="stats-grid">
        <div class="stat-card"><i class="fa-solid fa-book"></i><div class="num">${state.subjects.length}</div><div class="lbl">المواد</div></div>
        <div class="stat-card"><i class="fa-solid fa-file-lines"></i><div class="num">${totalLessons}</div><div class="lbl">الدروس</div></div>
        <div class="stat-card"><i class="fa-solid fa-circle-check"></i><div class="num">${memorized}</div><div class="lbl">دروس محفوظة</div></div>
        <div class="stat-card"><i class="fa-solid fa-layer-group"></i><div class="num">${totalCards}</div><div class="lbl">البطاقات</div></div>
        <div class="stat-card"><i class="fa-solid fa-clock"></i><div class="num">${dueCards}</div><div class="lbl">بطاقات مستحقة</div></div>
        <div class="stat-card"><i class="fa-solid fa-percent"></i><div class="num">${pct}%</div><div class="lbl">نسبة الحفظ</div></div>
      </div>
    </div>
  `;
}

   NOTIFICATIONS TAB
===================================================== */

/* =====================================================
   POMODORO
===================================================== */
function openPomodoro(){
  document.getElementById('pomoOverlay').classList.add('show');
  updatePomoDisplay();
}
function closePomodoro(){
  document.getElementById('pomoOverlay').classList.remove('show');
  if(pomoInterval){ clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false; }
}
function updatePomoDisplay(){
  const m = Math.floor(pomoTime/60).toString().padStart(2,'0');
  const s = (pomoTime%60).toString().padStart(2,'0');
  document.getElementById('pomoTime').textContent = `${m}:${s}`;
  document.getElementById('pomoPhase').textContent = pomoPhase === 'focus' ? 'جلسة تركيز' : 'راحة';
  const btn = document.getElementById('pomoStartBtn');
  btn.innerHTML = pomoRunning ? '<i class="fa-solid fa-pause"></i> إيقاف' : '<i class="fa-solid fa-play"></i> ابدأ';
}
function togglePomo(){
  if(pomoRunning){
    clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
  } else {
    pomoRunning = true;
    pomoInterval = setInterval(()=>{
      pomoTime--;
      if(pomoTime <= 0){
        clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
        if(pomoPhase === 'focus'){
          pomoPhase = 'break'; pomoTime = 5*60;
          pushNotif('info', 'خلصت الجلسة!', 'خذ راحة 5 دقائق');
        } else {
          pomoPhase = 'focus'; pomoTime = 25*60;
          pushNotif('info', 'خلصت الراحة!', 'ابدأ جلسة جديدة');
        }
      }
      updatePomoDisplay();
    }, 1000);
  }
  updatePomoDisplay();
}
function resetPomo(){
  clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
  pomoPhase = 'focus'; pomoTime = 25*60;
  updatePomoDisplay();
}
