<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِذكَرتي — مدير الدراسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --orange:#FF7A00;
  --orange-dark:#E65100;
  --orange-light:#FFB74D;
  --orange-glow:rgba(255,122,0,.18);
  --orange-soft:rgba(255,122,0,.08);
  --bg:#0F0F0F;
  --bg2:#171717;
  --card:#1E1E1E;
  --card2:#252525;
  --text:#F5F5F5;
  --muted:#8A8A8A;
  --border:#2A2A2A;
  --green:#4CAF50;
  --yellow:#FFC107;
  --blue:#2196F3;
  --red:#F44336;
  --gray:#9E9E9E;
  --font:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --radius:14px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
}
body.light{
  --bg:#FFF8F0; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#FFF5E8;
  --text:#1A1A1A; --muted:#7A7A7A; --border:#FFE0B2;
  --orange-soft:rgba(255,122,0,.06);
  --shadow:0 8px 32px rgba(255,122,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 20% 20%, var(--orange-soft) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, var(--orange-soft) 0%, transparent 40%),
    repeating-linear-gradient(45deg, var(--orange-glow) 0px, var(--orange-glow) 1px, transparent 1px, transparent 32px),
    repeating-linear-gradient(-45deg, var(--orange-glow) 0px, var(--orange-glow) 1px, transparent 1px, transparent 32px);
  background-size: 100% 100%, 100% 100%, 45px 45px, 45px 45px;
  background-attachment: fixed;
  color:var(--text);height:100vh;overflow:hidden;
  font-family:var(--font);font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .4s, color .4s;
}
h1,h2,h3,h4,strong,.btn,.tab,.stat-card .num{font-family:var(--font);font-weight:700}
.app{display:flex;height:100vh}

/* ============ Login ============ */
#loginScreen{
  position:fixed;inset:0;
  background:radial-gradient(circle at 50% 30%, #1F1F1F, #0A0A0A);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:28px;z-index:1000;
  padding:20px;text-align:center;
}
#loginScreen .logo-wrap{
  width:140px;height:140px;border-radius:36px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 60px rgba(255,122,0,.4);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}
#loginScreen .logo-wrap i{font-size:70px;color:#fff}
#loginScreen h1{
  color:var(--orange);font-size:42px;font-weight:900;
  letter-spacing:-1px;margin:0;
}
#loginScreen p{
  color:var(--muted);font-size:15px;line-height:1.8;
  max-width:400px;margin:0;
}
.google-btn{
  background:#fff;color:#333;border:none;
  padding:16px 32px;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-family:var(--font);
  box-shadow:0 12px 40px rgba(255,122,0,.3);
  transition:all .3s;
}
.google-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 50px rgba(255,122,0,.5);
}
.login-features{
  display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;justify-content:center;
}
.login-features div{
  display:flex;align-items:center;gap:8px;
  color:var(--muted);font-size:13px;
}
.login-features i{color:var(--orange)}

/* ============ Sidebar ============ */
.sidebar{
  width:300px;background:var(--bg2);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:.35s cubic-bezier(.4,0,.2,1);
  backdrop-filter:blur(20px);
}
.sidebar.hidden{width:0;overflow:hidden;padding:0;border:none}
.sidebar-header{
  padding:22px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.sidebar-header .logo-mini{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(255,122,0,.35);
}
.sidebar-header .logo-mini i{color:#fff;font-size:20px}
.sidebar-header h1{
  font-size:20px;color:var(--orange);font-weight:900;
  letter-spacing:-.5px;
}
.user-info{
  padding:12px 18px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  overflow:hidden;
}
.user-info img{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--orange);
}
.user-info .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--text)}
.search{padding:12px 14px;border-bottom:1px solid var(--border);position:relative}
.search i{position:absolute;right:28px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.search input{
  width:100%;padding:11px 38px 11px 14px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);outline:none;font-size:13px;
  font-family:var(--font);transition:.2s;
}
.search input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.subjects{flex:1;overflow-y:auto;padding:10px}
.subject{margin-bottom:8px}
.subject-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 12px;border-radius:12px;cursor:pointer;
  user-select:none;transition:.2s;
}
.subject-head:hover{background:var(--card)}
.subject-head .name{
  display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:14px;flex:1;
  overflow:hidden;
}
.subject-head .name i{
  color:var(--orange);
  width:22px;text-align:center;font-size:15px;
}
.subject-head .actions{
  opacity:0;transition:.2s;display:flex;gap:8px;
}
.subject-head:hover .actions{opacity:1}
.subject-head .actions i{
  color:var(--orange);cursor:pointer;font-size:12px;
  width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:var(--orange-soft);transition:.2s;
}
.subject-head .actions i:hover{background:var(--orange);color:#fff}
.lessons{margin-right:16px;margin-top:2px}
.lesson{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:9px;
  cursor:pointer;font-size:13px;
  transition:.2s;font-weight:500;
}
.lesson:hover{background:var(--card)}
.lesson.active{background:var(--orange);color:#fff;font-weight:600}
.lesson.active .dot{background:#fff !important;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.lesson .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson .del{opacity:0;color:var(--red);font-size:12px;transition:.2s}
.lesson:hover .del{opacity:.8}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.new{background:var(--gray)}
.dot.reading{background:var(--yellow)}
.dot.partial{background:var(--blue)}
.dot.memorized{background:var(--green)}
.dot.needs_review{background:var(--red)}
.sidebar-footer{padding:14px;border-top:1px solid var(--border)}

/* ============ Main ============ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{
  padding:14px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;background:var(--bg2);
  backdrop-filter:blur(20px);
}
.menu-btn{
  background:none;border:none;color:var(--text);
  font-size:20px;cursor:pointer;padding:6px;border-radius:8px;
  transition:.2s;
}
.menu-btn:hover{background:var(--card);color:var(--orange)}
.topbar .title{flex:1;font-weight:700;font-size:15px}
.icon-btn{
  background:var(--bg);border:1px solid var(--border);
  color:var(--text);padding:9px 12px;border-radius:10px;
  cursor:pointer;font-size:14px;transition:.2s;
  position:relative;
}
.icon-btn:hover{
  border-color:var(--orange);color:var(--orange);
  background:var(--orange-soft);
  transform:translateY(-1px);
}
.icon-btn .badge{
  position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;
  font-size:10px;padding:2px 6px;border-radius:10px;
  font-weight:700;min-width:18px;text-align:center;
  box-shadow:0 2px 8px rgba(244,67,54,.4);
}
.icon-btn .badge.hidden{display:none}

/* ============ Notifications Panel ============ */
.notif-panel{
  position:fixed;top:70px;left:20px;width:360px;max-height:520px;
  overflow-y:auto;background:var(--card);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  z-index:150;transform:translateY(-10px);opacity:0;
  pointer-events:none;transition:.25s;backdrop-filter:blur(20px);
}
.notif-panel.show{transform:translateY(0);opacity:1;pointer-events:auto}
.notif-head{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--card);z-index:2;
  border-radius:16px 16px 0 0;
}
.notif-head h4{font-size:15px;color:var(--orange);display:flex;align-items:center;gap:8px}
.notif-head .clear-all{
  background:none;border:none;color:var(--muted);
  font-size:12px;cursor:pointer;font-family:var(--font);
  padding:4px 8px;border-radius:6px;transition:.2s;
}
.notif-head .clear-all:hover{color:var(--red);background:rgba(244,67,54,.1)}
.notif-list{padding:10px}
.notif-item{
  padding:12px 14px;border-radius:12px;margin-bottom:6px;
  display:flex;gap:12px;align-items:flex-start;
  background:var(--bg);border-right:3px solid var(--orange);
  transition:.2s;cursor:pointer;
}
.notif-item:hover{background:var(--card2);transform:translateX(-2px)}
.notif-item.read{opacity:.5;border-right-color:var(--muted)}
.notif-item.exam{border-right-color:var(--red)}
.notif-item.review{border-right-color:var(--blue)}
.notif-item.memory{border-right-color:var(--green)}
.notif-item i{color:var(--orange);font-size:15px;margin-top:3px}
.notif-item.exam i{color:var(--red)}
.notif-item.review i{color:var(--blue)}
.notif-item.memory i{color:var(--green)}
.notif-item .body{flex:1;font-size:13px;line-height:1.6}
.notif-item .body strong{display:block;margin-bottom:3px;font-weight:700}
.notif-item .body .time{font-size:11px;color:var(--muted);margin-top:5px}
.notif-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.notif-empty i{font-size:36px;display:block;margin-bottom:10px;opacity:.4;color:var(--orange)}

.content{flex:1;overflow-y:auto;padding:26px}

/* ============ Empty ============ */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--muted);text-align:center;gap:16px;
}
.empty .icon-big{
  width:100px;height:100px;border-radius:28px;
  background:var(--orange-soft);border:2px dashed var(--orange);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;
}
.empty .icon-big i{font-size:44px;color:var(--orange)}
.empty h2{font-size:24px;color:var(--text);font-weight:800}
.empty p{font-size:14px;max-width:440px;line-height:1.8}

/* ============ Lesson View ============ */
.lesson-view{max-width:880px;margin:0 auto}
.lesson-view .header{
  display:flex;align-items:center;gap:14px;margin-bottom:8px;
}
.lesson-view .header .subj-icon{
  width:48px;height:48px;border-radius:14px;
  background:var(--orange-soft);border:1px solid var(--orange);
  display:flex;align-items:center;justify-content:center;
  color:var(--orange);font-size:20px;
}
.lesson-view h2{font-size:26px;color:var(--text);font-weight:800}
.lesson-view .meta{color:var(--muted);font-size:13px;margin-bottom:22px}
.section{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:20px;margin-bottom:16px;
  transition:.2s;
}
.section:hover{border-color:var(--orange);box-shadow:0 8px 30px rgba(255,122,0,.08)}
.section h3{
  font-size:15px;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
  color:var(--orange);font-weight:700;
}
.section h3 i{
  width:30px;height:30px;border-radius:9px;
  background:var(--orange-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.status-btns{display:flex;flex-wrap:wrap;gap:8px}
.status-btn{
  padding:10px 16px;border-radius:11px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);cursor:pointer;font-size:13px;
  transition:.2s;display:flex;align-items:center;gap:7px;
  font-family:var(--font);font-weight:600;
}
.status-btn:hover{border-color:var(--orange);transform:translateY(-1px)}
.status-btn.active{
  border-color:var(--orange);background:var(--orange);
  color:#fff;box-shadow:0 4px 15px rgba(255,122,0,.4);
}

.feynman-area textarea{
  width:100%;padding:14px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);outline:none;font-size:14px;
  font-family:var(--font);min-height:120px;resize:vertical;
  line-height:1.8;transition:.2s;
}
.feynman-area textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.feynman-result{
  margin-top:12px;font-size:13px;padding:12px 14px;
  border-radius:12px;display:none;line-height:1.7;
}
.feynman-result.show{display:block;animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.feynman-result.good{background:rgba(76,175,80,.15);color:#81C784;border:1px solid rgba(76,175,80,.4)}
.feynman-result.bad{background:rgba(244,67,54,.15);color:#EF9A9A;border:1px solid rgba(244,67,54,.4)}

.cards-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.card-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 15px;background:var(--bg);
  border-radius:12px;font-size:13px;border:1px solid var(--border);
  transition:.2s;
}
.card-item:hover{border-color:var(--orange);transform:translateX(-3px)}
.card-item .q{flex:1;line-height:1.6}
.card-item .lvl{font-size:11px;padding:4px 11px;border-radius:20px;font-weight:700}
.lvl-1{background:rgba(244,67,54,.2);color:#EF9A9A}
.lvl-2{background:rgba(255,193,7,.2);color:#FFD54F}
.lvl-3{background:rgba(76,175,80,.2);color:#81C784}
.card-item .del{color:var(--red);cursor:pointer;opacity:.5;transition:.2s}
.card-item .del:hover{opacity:1}

.sched{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sched-item{
  padding:8px 15px;border-radius:20px;font-size:12px;
  background:var(--bg);border:1px solid var(--border);font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.sched-item.done{background:rgba(76,175,80,.15);border-color:var(--green);color:#81C784}
.sched-item.due{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}

/* ============ Buttons ============ */
.btn{
  padding:11px 20px;border:none;border-radius:11px;
  cursor:pointer;font-size:14px;font-weight:700;
  transition:.2s;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font);
}
.btn-primary{
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  color:#fff;box-shadow:0 6px 20px rgba(255,122,0,.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,122,0,.5)}
.btn-ghost{
  background:var(--bg);color:var(--text);border:1px solid var(--border);
}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.btn-sm{padding:9px 16px;font-size:12px}

/* ============ Modals ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(6px);
}
.modal-bg.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:26px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);
  animation:popIn .3s;
}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{
  margin-bottom:18px;font-size:19px;color:var(--orange);
  display:flex;align-items:center;gap:10px;font-weight:800;
}
.modal label{
  display:block;font-size:13px;color:var(--muted);
  margin-bottom:7px;margin-top:14px;font-weight:600;
}
.modal input,.modal select,.modal textarea{
  width:100%;padding:12px 14px;border-radius:11px;
  border:1px solid var(--border);background:var(--bg);
  color:var(--text);outline:none;font-size:14px;
  font-family:var(--font);transition:.2s;
}
.modal input:focus,.modal textarea:focus,.modal select:focus{
  border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);
}
.modal textarea{min-height:90px;resize:vertical;line-height:1.7}
.modal-actions{display:flex;gap:10px;margin-top:22px;justify-content:flex-end}
.icon-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.icon-picker i{
  padding:14px 0;text-align:center;border:1px solid var(--border);
  border-radius:11px;cursor:pointer;font-size:18px;
  color:var(--muted);transition:.2s;
}
.icon-picker i:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
.icon-picker i.selected{
  background:var(--orange);color:#fff;border-color:var(--orange);
  box-shadow:0 4px 15px rgba(255,122,0,.4);
}

/* ============ Permission Banner ============ */
.perm-banner{
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  color:#fff;padding:14px 18px;border-radius:13px;
  margin-bottom:18px;display:flex;align-items:center;
  gap:12px;justify-content:space-between;font-size:13px;
  box-shadow:0 8px 25px rgba(255,122,0,.3);
}
.perm-banner button{
  background:#fff;color:var(--orange-dark);border:none;
  padding:8px 16px;border-radius:9px;cursor:pointer;
  font-weight:700;font-family:var(--font);font-size:12px;
  transition:.2s;
}
.perm-banner button:hover{transform:scale(1.05)}

/* ============ Flashcards ============ */
.fc-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  display:none;align-items:center;justify-content:center;
  z-index:200;padding:20px;flex-direction:column;
  backdrop-filter:blur(8px);
}
.fc-overlay.show{display:flex}
.fc{
  background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:50px 40px;
  max-width:560px;width:100%;text-align:center;
  min-height:320px;display:flex;flex-direction:column;
  justify-content:center;gap:24px;
  box-shadow:0 30px 80px rgba(255,122,0,.2);
}
.fc .q{font-size:22px;font-weight:700;line-height:1.7}
.fc .a{
  font-size:16px;color:var(--muted);
  padding-top:24px;border-top:1px dashed var(--border);
  margin-top:24px;line-height:1.8;
}
.fc-progress{color:var(--muted);font-size:13px;margin-bottom:16px;font-weight:600}
.fc-actions{display:flex;gap:10px;margin-top:28px;justify-content:center;flex-wrap:wrap}
.rate-1{background:#dc2626;color:#fff}
.rate-2{background:#eab308;color:#000}
.rate-3{background:#22c55e;color:#fff}
.rate-1,.rate-2,.rate-3{transition:.2s}
.rate-1:hover,.rate-2:hover,.rate-3:hover{transform:translateY(-2px)}
.close-x{
  position:absolute;top:24px;left:24px;background:var(--card);
  border:1px solid var(--border);color:var(--text);
  font-size:20px;cursor:pointer;width:44px;height:44px;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.close-x:hover{background:var(--red);color:#fff;border-color:var(--red)}

/* ============ Pomodoro ============ */
.pomo-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  display:none;align-items:center;justify-content:center;
  z-index:200;flex-direction:column;backdrop-filter:blur(8px);
}
.pomo-overlay.show{display:flex}
.pomo{text-align:center;color:#fff}
.pomo .time{
  font-size:110px;font-weight:900;color:var(--orange);
  letter-spacing:6px;font-family:var(--font);
  text-shadow:0 0 60px rgba(255,122,0,.5);
  line-height:1;
}
.pomo .phase{font-size:22px;color:var(--muted);margin-bottom:24px;font-weight:600}
.pomo .controls{display:flex;gap:14px;margin-top:36px;justify-content:center}

/* ============ Calendar ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:14px}
.cal-day{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:12px;min-height:130px;font-size:12px;
  transition:.2s;
}
.cal-day:hover{border-color:var(--orange)}
.cal-day .dname{
  font-weight:800;color:var(--orange);margin-bottom:8px;font-size:13px;
  display:flex;align-items:center;gap:6px;
}
.cal-item{
  background:var(--orange-soft);border-right:3px solid var(--orange);
  padding:6px 9px;border-radius:8px;margin-bottom:5px;
  font-size:11px;line-height:1.5;
}
.cal-item.exam{background:rgba(244,67,54,.15);border-color:var(--red)}
.cal-item.review{background:rgba(33,150,243,.15);border-color:var(--blue)}

/* ============ Stats ============ */
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:16px;padding:24px;text-align:center;
  transition:.2s;position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--orange-dark));
  transform:scaleX(0);transition:.3s;
}
.stat-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(255,122,0,.15)}
.stat-card:hover::before{transform:scaleX(1)}
.stat-card i{
  font-size:32px;color:var(--orange);margin-bottom:12px;
  width:60px;height:60px;border-radius:16px;
  background:var(--orange-soft);display:inline-flex;
  align-items:center;justify-content:center;
}
.stat-card .num{font-size:34px;font-weight:900;color:var(--orange);line-height:1}
.stat-card .lbl{font-size:13px;color:var(--muted);margin-top:8px;font-weight:600}

/* ============ Tabs ============ */
.tabs{
  display:flex;gap:6px;padding:0 22px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.tab{
  padding:15px 18px;cursor:pointer;font-size:13px;
  color:var(--muted);border-bottom:3px solid transparent;
  transition:.2s;display:flex;align-items:center;gap:8px;
  white-space:nowrap;font-weight:600;
}
.tab:hover{color:var(--text);background:var(--orange-soft)}
.tab.active{
  color:var(--orange);border-bottom-color:var(--orange);
  background:var(--orange-soft);
}
.tab i{font-size:14px}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:24px;left:24px;
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  color:#fff;padding:15px 22px;border-radius:14px;
  font-size:14px;z-index:300;transform:translateY(120px);
  opacity:0;transition:.35s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:12px;font-weight:600;
  box-shadow:0 12px 40px rgba(255,122,0,.5);
}
.toast.show{transform:translateY(0);opacity:1}

/* ============ Scrollbar ============ */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--orange)}

/* ============ Mobile ============ */
@media(max-width:768px){
  .sidebar{
    position:fixed;right:0;top:0;height:100vh;
    z-index:50;box-shadow:-10px 0 40px rgba(0,0,0,.6);
  }
  .cal-grid{grid-template-columns:1fr 1fr}
  .lesson-view h2{font-size:20px}
  .notif-panel{width:calc(100vw - 40px);left:20px}
  .pomo .time{font-size:70px}
  .fc{padding:34px 24px}
  .fc .q{font-size:18px}
}
</style>
</head>

<script>
/* =====================================================
   SUPABASE CONFIG
===================================================== */
var SUPABASE_URL = 'https://ncrycgbrstafdouvipzc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var currentUser = null;

/* ============ Auth ============ */
async function signInWithGoogle() {
  var result = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if (result.error) alert('خطأ: ' + result.error.message);
}

async function signOut() {
  await sb.auth.signOut();
  location.reload();
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appContainer').style.display = 'none';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
}

function renderUserInfo(user) {
  var info = document.getElementById('userInfo');
  var meta = user.user_metadata || {};
  var avatar = meta.avatar_url || '';
  var name = meta.full_name || user.email || 'مستخدم';
  info.innerHTML = (avatar ? '<img src="' + avatar + '" alt="">' : '<i class="fa-solid fa-user" style="color:var(--orange)"></i>') +
    '<span class="name">' + name + '</span>';
}

sb.auth.onAuthStateChange(async function(event, session) {
  if (session && session.user) {
    currentUser = session.user;
    showApp();
    renderUserInfo(session.user);
    await loadAllData();
  } else {
    currentUser = null;
    showLogin();
  }
});

/* =====================================================
   STATE
===================================================== */
var state = {subjects:[], schedule:[], notifications:[], theme:'dark'};
var currentLessonId = null, currentSubjectId = null, tempSubjectId = null;
var currentTab = 'study';
var selectedIcon = 'fa-book';
var fcQueue = [], fcIndex = 0, fcFlipped = false;
var pomoInterval = null, pomoTime = 25*60, pomoRunning = false, pomoPhase = 'focus';
var notifCheckInterval = null;

var ICONS = ['fa-calculator','fa-atom','fa-flask','fa-book-open','fa-language','fa-spell-check','fa-landmark','fa-globe','fa-mosque','fa-scale-balanced','fa-dna','fa-earth-africa','fa-palette','fa-music','fa-laptop-code'];
var DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var SPACED_INTERVALS = [1, 3, 7, 21];

/* ============ Helpers ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg, icon){
  icon = icon || 'fa-circle-check';
  var t = document.getElementById('toast');
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('ar-DZ'); }
function timeAgo(ts){
  var diff = Date.now() - ts;
  var m = Math.floor(diff/60000);
  if(m < 1) return 'الآن';
  if(m < 60) return 'قبل ' + m + ' دقيقة';
  var h = Math.floor(m/60);
  if(h < 24) return 'قبل ' + h + ' ساعة';
  var d = Math.floor(h/24);
  return 'قبل ' + d + ' يوم';
}

/* =====================================================
   LOAD DATA
===================================================== */
async function loadAllData() {
  if (!currentUser) return;
  var results = await Promise.all([
    sb.from('subjects').select('*').order('created_at'),
    sb.from('lessons').select('*'),
    sb.from('cards').select('*'),
    sb.from('schedule').select('*'),
    sb.from('notifications').select('*').order('created_at', {ascending:false}).limit(100)
  ]);
  var s = results[0], l = results[1], c = results[2], sc = results[3], n = results[4];

  state.subjects = (s.data || []).map(function(sub){
    return {
      id: sub.id, name: sub.name, icon: sub.icon || 'fa-book',
      lessons: (l.data || []).filter(function(x){ return x.subject_id === sub.id; }).map(function(les){
        return {
          id: les.id, title: les.title, status: les.status || 'new', date: les.lesson_date,
          feynman: { done: les.feynman_done || false, text: les.feynman_text || '' },
          spaced: {
            stage: les.spaced_stage || 0,
            history: les.spaced_history || [],
            nextReview: les.spaced_next_review ? new Date(les.spaced_next_review).getTime() : null,
            notified: null
          },
          cards: (c.data || []).filter(function(x){ return x.lesson_id === les.id; }).map(function(cd){
            return {
              id: cd.id, q: cd.q, a: cd.a, level: cd.level || 2,
              nextReview: cd.next_review ? new Date(cd.next_review).getTime() : Date.now()
            };
          })
        };
      })
    };
  });

  state.schedule = (sc.data || []).map(function(x){ return {id:x.id, type:x.type, day:x.day, title:x.title, time:x.time}; });
  state.notifications = (n.data || []).map(function(x){ return {id:x.id, type:x.type, title:x.title, body:x.body, time:new Date(x.created_at).getTime(), read:x.read}; });

  renderSubjects();
  renderContent();
  renderNotifBadge();
  renderNotifList();
}

/* =====================================================
   NOTIFICATIONS
===================================================== */
function requestNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default') Notification.requestPermission();
}

async function pushNotif(type, title, body){
  if(!currentUser) return;
  var result = await sb.from('notifications').insert({
    user_id: currentUser.id, type: type, title: title, body: body, read: false
  }).select().single();

  if(result.data){
    state.notifications.unshift({
      id: result.data.id, type: type, title: title, body: body,
      time: new Date(result.data.created_at).getTime(), read: false
    });
    renderNotifBadge();
    renderNotifList();
  }

  if('Notification' in window && Notification.permission === 'granted'){
    try{
      var n = new Notification(title, {body: body});
      setTimeout(function(){ n.close(); }, 6000);
    }catch(e){}
  }

  var icon = type === 'exam' ? 'fa-file-pen' : type === 'review' ? 'fa-rotate' : type === 'memory' ? 'fa-brain' : 'fa-bell';
  toast(title + ' — ' + body, icon);
}

function renderNotifBadge(){
  var unread = (state.notifications || []).filter(function(n){ return !n.read; }).length;
  var badge = document.getElementById('notifBadge');
  if(unread > 0){
    badge.textContent = unread > 99 ? '99+' : unread;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function renderNotifList(){
  var list = document.getElementById('notifList');
  if(!list) return;
  var notifs = state.notifications || [];
  if(notifs.length === 0){
    list.innerHTML = '<div class="notif-empty"><i class="fa-solid fa-bell-slash"></i>لا إشعارات بعد</div>';
    return;
  }
  list.innerHTML = notifs.slice(0, 20).map(function(n){
    var icon = n.type === 'exam' ? 'fa-file-pen' : n.type === 'review' ? 'fa-rotate' : n.type === 'memory' ? 'fa-brain' : n.type === 'study' ? 'fa-lightbulb' : 'fa-bell';
    var cls = n.type === 'exam' ? 'exam' : n.type === 'review' ? 'review' : n.type === 'memory' ? 'memory' : '';
    return '<div class="notif-item ' + (n.read?'read':'') + ' ' + cls + '" onclick="markNotifRead(\'' + n.id + '\')">' +
      '<i class="fa-solid ' + icon + '"></i>' +
      '<div class="body"><strong>' + escapeHtml(n.title) + '</strong>' + escapeHtml(n.body) +
      '<div class="time"><i class="fa-regular fa-clock"></i> ' + timeAgo(n.time) + '</div></div></div>';
  }).join('');
}

async function markNotifRead(id){
  await sb.from('notifications').update({read:true}).eq('id', id);
  var n = state.notifications.find(function(x){ return x.id === id; });
  if(n) n.read = true;
  renderNotifBadge();
  renderNotifList();
}

function toggleNotifPanel(){
  var p = document.getElementById('notifPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show')) renderNotifList();
}

async function clearAllNotifs(){
  if(!confirm('مسح كل الإشعارات؟')) return;
  await sb.from('notifications').delete().eq('user_id', currentUser.id);
  state.notifications = [];
  renderNotifBadge();
  renderNotifList();
}

function checkDueReminders(){
  var now = Date.now();
  state.subjects.forEach(function(s){
    s.lessons.forEach(function(l){
      if(l.spaced && l.spaced.nextReview && l.spaced.nextReview <= now){
        var key = 'sp_' + l.id + '_' + l.spaced.stage;
        if(!l.spaced.notified || l.spaced.notified !== key){
          pushNotif('review', 'مراجعة مستحقة', s.name + ': ' + l.title);
          l.spaced.notified = key;
        }
      }
    });
  });
}

/* =====================================================
   RENDER CONTENT
===================================================== */
var statusLabels = {
  new:{l:'جديد', i:'fa-circle'},
  reading:{l:'قيد الفهم', i:'fa-book-open-reader'},
  partial:{l:'محفوظ جزئي', i:'fa-circle-half-stroke'},
  memorized:{l:'محفوظ', i:'fa-circle-check'},
  needs_review:{l:'يحتاج مراجعة', i:'fa-rotate'}
};

function renderContent(){
  var content = document.getElementById('content');
  var titleEl = document.getElementById('topTitle');

  if(currentTab === 'calendar') return renderCalendar(content, titleEl);
  if(currentTab === 'schedule') return renderSchedule(content, titleEl);
  if(currentTab === 'stats') return renderStats(content, titleEl);
  if(currentTab === 'notifs') return renderNotifsTab(content, titleEl);

  if(!currentLessonId){
    titleEl.textContent = 'اختر درساً من القائمة';
    content.innerHTML = '<div class="empty">' +
      '<div class="icon-big"><i class="fa-solid fa-graduation-cap"></i></div>' +
      '<h2>أهلاً بك في مِذكَرتي</h2>' +
      '<p>أضف مادة من السايد بار، ثم أضف دروسك. لكل درس: نظام فهم (فاينمان) + نظام حفظ (بطاقات + تكرار متباعد).</p>' +
      '</div>';
    return;
  }

  var s = state.subjects.find(function(x){ return x.id===currentSubjectId; });
  var l = s && s.lessons.find(function(x){ return x.id===currentLessonId; });
  if(!l){ currentLessonId=null; renderContent(); return; }

  titleEl.textContent = s.name + ' — ' + l.title;

  var now = Date.now();
  var due = l.cards.filter(function(c){ return !c.nextReview || c.nextReview <= now; }).length;
  var spaced = l.spaced || {stage:0, history:[]};

  var spacedHtml = SPACED_INTERVALS.map(function(days, i){
    var done = spaced.history && spaced.history[i];
    var dueNow = !done && (i===0 || (spaced.history && spaced.history[i-1])) && spaced.stage === i;
    var cls = done ? 'done' : (dueNow ? 'due' : '');
    var icon = done ? 'fa-check' : (dueNow ? 'fa-clock' : 'fa-circle');
    return '<div class="sched-item ' + cls + '"><i class="fa-solid ' + icon + '"></i> J+' + days + '</div>';
  }).join('');

  var permBanner = (('Notification' in window) && Notification.permission === 'default') ?
    '<div class="perm-banner"><span><i class="fa-solid fa-bell"></i> فعّل إشعارات المتصفح لتصلك تنبيهات المراجعة.</span>' +
    '<button onclick="requestNotifPermission()">تفعيل</button></div>' : '';

  content.innerHTML = '<div class="lesson-view">' + permBanner +
    '<div class="header">' +
    '<div class="subj-icon"><i class="fa-solid ' + s.icon + '"></i></div>' +
    '<h2>' + escapeHtml(l.title) + '</h2></div>' +
    '<div class="meta">' + s.name + ' · ' + l.cards.length + ' بطاقة</div>' +

    '<div class="section">' +
    '<h3><i class="fa-solid fa-signal"></i> حالة الدرس</h3>' +
    '<div class="status-btns">' +
    Object.keys(statusLabels).map(function(k){
      var v = statusLabels[k];
      return '<button class="status-btn ' + (l.status===k?'active':'') + '" onclick="setStatus(\'' + k + '\')">' +
        '<i class="fa-solid ' + v.i + '"></i> ' + v.l + '</button>';
    }).join('') + '</div></div>' +

    '<div class="section">' +
    '<h3><i class="fa-solid fa-lightbulb"></i> نظام الفهم — تقنية فاينمان</h3>' +
    '<p style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.8">' +
    'اشرح الدرس بكلماتك البسيطة، كأنك تدرّس طالباً لا يعرفه.</p>' +
    '<div class="feynman-area">' +
    '<textarea id="feynmanText" placeholder="اشرح الدرس هنا...">' + escapeHtml((l.feynman && l.feynman.text) || '') + '</textarea>' +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
    '<button class="btn btn-primary btn-sm" onclick="checkFeynman()"><i class="fa-solid fa-brain"></i> اختبر فهمي</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="saveFeynman()"><i class="fa-solid fa-floppy-disk"></i> حفظ الشرح</button>' +
    (l.feynman && l.feynman.done ? '<span class="sched-item done"><i class="fa-solid fa-check"></i> تم الفهم</span>' : '') +
    '</div><div class="feynman-result" id="feynmanResult"></div></div></div>' +

    '<div class="section">' +
    '<h3><i class="fa-solid fa-layer-group"></i> نظام الحفظ — بطاقات (' + l.cards.length + ')</h3>' +
    '<div class="cards-list">' +
    (l.cards.length===0 ? '<p style="color:var(--muted);font-size:13px">لا توجد بطاقات بعد.</p>' :
      l.cards.map(function(c){
        return '<div class="card-item"><span class="q">' + escapeHtml(c.q) + '</span>' +
          '<span class="lvl lvl-' + c.level + '">' + ['','صعب','متوسط','سهل'][c.level] + '</span>' +
          '<i class="fa-solid fa-trash del" onclick="deleteCard(\'' + c.id + '\')"></i></div>';
      }).join('')) + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn btn-ghost btn-sm" onclick="openCardModal()"><i class="fa-solid fa-plus"></i> إضافة بطاقة</button>' +
    (l.cards.length>0 ? '<button class="btn btn-primary btn-sm" onclick="startFlashcards()"><i class="fa-solid fa-play"></i> مراجعة (' + due + ' مستحقة)</button>' : '') +
    '</div></div>' +

    '<div class="section">' +
    '<h3><i class="fa-solid fa-rotate"></i> التكرار المتباعد</h3>' +
    '<div class="sched">' + spacedHtml + '</div>' +
    (spaced.nextReview ? '<p style="font-size:12px;color:var(--orange);margin-top:12px"><i class="fa-solid fa-clock"></i> المراجعة القادمة: ' + fmtDate(spaced.nextReview) + '</p>' : '') +
    '<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="markSpacedReview()">' +
    '<i class="fa-solid fa-check"></i> أنجزت مراجعة هذه المرحلة</button>' +
    '</div></div>';
}

async function setStatus(st){
  var l = getCurrentLesson(); if(!l) return;
  await sb.from('lessons').update({status:st}).eq('id', l.id);
  l.status = st;
  renderSubjects(); renderContent();
  toast('تم تحديث الحالة');
}
function getCurrentLesson(){
  var s = state.subjects.find(function(x){ return x.id===currentSubjectId; });
  return s && s.lessons.find(function(x){ return x.id===currentLessonId; });
}

/* =====================================================
   FEYNMAN
===================================================== */
async function saveFeynman(){
  var l = getCurrentLesson(); if(!l) return;
  var txt = document.getElementById('feynmanText').value.trim();
  await sb.from('lessons').update({feynman_text:txt}).eq('id', l.id);
  l.feynman = l.feynman || {done:false, text:''};
  l.feynman.text = txt;
  toast('تم حفظ الشرح');
}

async function checkFeynman(){
  var l = getCurrentLesson(); if(!l) return;
  var txt = document.getElementById('feynmanText').value.trim();
  var res = document.getElementById('feynmanResult');
  if(txt.length < 30){
    res.className = 'feynman-result show bad';
    res.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> الشرح قصير جداً — اكتب أكثر.';
    return;
  }
  var words = txt.split(/\s+/).length;
  var hasExamples = /مثال|مثلا|مثل|يعني|كأن|تقريبا/.test(txt);
  var hasSimple = /بسيط|سهل|يعني|كأن|هو|هي/.test(txt);
  var score = (words>50?1:0) + (hasExamples?1:0) + (hasSimple?1:0);

  if(score >= 2){
    res.className = 'feynman-result show good';
    res.innerHTML = '<i class="fa-solid fa-circle-check"></i> ممتاز! شرحت بأسلوب مبسّط ومفصل.';
    await sb.from('lessons').update({feynman_done:true, feynman_text:txt}).eq('id', l.id);
    l.feynman = {done:true, text:txt};
    if(l.status === 'new' || l.status === 'reading'){ l.status = 'reading'; await sb.from('lessons').update({status:'reading'}).eq('id', l.id); }
    renderSubjects();
    pushNotif('study', 'أحسنت! فهمت درساً', l.title);
  } else {
    res.className = 'feynman-result show bad';
    res.innerHTML = '<i class="fa-solid fa-lightbulb"></i> حاول تبسّط أكثر مع أمثلة.';
  }
}

async function deleteCard(cid){

/* =====================================================
   FLASHCARDS
===================================================== */
function startFlashcards(){
  var l = getCurrentLesson();
  if(!l || l.cards.length===0) return;
  var now = Date.now();
  fcQueue = l.cards.filter(function(c){ return !c.nextReview || c.nextReview <= now; });
  if(fcQueue.length===0) fcQueue = [].concat(l.cards);
  fcQueue.sort(function(){ return Math.random()-0.5; });
  fcIndex = 0; fcFlipped = false;
  document.getElementById('fcOverlay').classList.add('show');
  renderFlashcard();
}
function renderFlashcard(){
  var box = document.getElementById('fcBox');
  var prog = document.getElementById('fcProgress');
  if(fcIndex >= fcQueue.length){
    box.innerHTML = '<div class="q">🎉 خلصت المراجعة!</div><div class="a">راجعت ' + fcQueue.length + ' بطاقة</div>';
    prog.textContent = '';
    setTimeout(closeFlashcards, 1500);
    return;
  }
  var c = fcQueue[fcIndex];
  prog.textContent = 'بطاقة ' + (fcIndex+1) + ' من ' + fcQueue.length;
  if(!fcFlipped){
    box.innerHTML = '<div class="q">' + escapeHtml(c.q) + '</div>' +
      '<div class="fc-actions"><button class="btn btn-primary" onclick="flipCard()"><i class="fa-solid fa-eye"></i> اكشف الجواب</button></div>';
  } else {
    box.innerHTML = '<div class="q">' + escapeHtml(c.q) + '</div><div class="a">' + escapeHtml(c.a) + '</div>' +
      '<div class="fc-actions">' +
      '<button class="btn rate-1" onclick="rateCard(1)"><i class="fa-solid fa-face-tired"></i> صعب</button>' +
      '<button class="btn rate-2" onclick="rateCard(2)"><i class="fa-solid fa-face-meh"></i> متوسط</button>' +
      '<button class="btn rate-3" onclick="rateCard(3)"><i class="fa-solid fa-face-smile"></i> سهل</button>' +
      '</div>';
  }
}
function flipCard(){ fcFlipped = true; renderFlashcard(); }
async function rateCard(level){
  var c = fcQueue[fcIndex];
  var l = getCurrentLesson();
  var orig = l.cards.find(function(x){ return x.id===c.id; });
  if(orig){
    orig.level = level;
    var delays = {1: 10*60*1000, 2: 24*60*60*1000, 3: 4*24*60*60*1000};
    orig.nextReview = Date.now() + delays[level];
    await sb.from('cards').update({level: level, next_review: new Date(orig.nextReview).toISOString()}).eq('id', orig.id);
  }
  fcIndex++; fcFlipped = false;
  renderFlashcard();
}
function closeFlashcards(){
  document.getElementById('fcOverlay').classList.remove('show');
  renderContent(); renderSubjects();
}

/* =====================================================
   SPACED REPETITION
===================================================== */
async function markSpacedReview(){
  var l = getCurrentLesson(); if(!l) return;
  var idx = l.spaced.stage;
  if(idx >= SPACED_INTERVALS.length){ toast('أكملت كل المراجعات','fa-check'); return; }
  l.spaced.history[idx] = Date.now();
  l.spaced.stage = idx + 1;
  var nextReview = null;
  var newStatus = l.status;
  if(idx+1 < SPACED_INTERVALS.length){
    nextReview = new Date(Date.now() + SPACED_INTERVALS[idx+1]*24*60*60*1000).toISOString();
    l.spaced.nextReview = new Date(nextReview).getTime();
  } else {
    l.spaced.nextReview = null;
    l.status = 'memorized';
    newStatus = 'memorized';
  }
  l.spaced.notified = null;
  await sb.from('lessons').update({
    spaced_stage: l.spaced.stage,
    spaced_history: l.spaced.history,
    spaced_next_review: nextReview,
    status: newStatus
  }).eq('id', l.id);
  renderSubjects(); renderContent();
  pushNotif('review', 'أنجزت مراجعة', l.title);
}

    '</div><div class="cal-grid">' +
    DAYS.map(function(d){
      return '<div class="cal-day"><div class="dname">' + d + '</div>' +
        (grouped[d].length===0 ? '<div style="color:var(--muted);font-size:11px">لا حصص</div>' :
          grouped[d].map(function(it){
            return '<div class="cal-item ' + (it.type==='exam'?'exam':it.type==='review'?'review':'') + '">' +
              '<strong>' + escapeHtml(it.title) + '</strong>' +

              '<i class="fa-solid fa-xmark" style="float:left;cursor:pointer;opacity:.6" onclick="delSched(\'' + it.id + '\')"></i>' +
              '</div>';
          }).join('')) + '</div>';

async function addSched(){
  var type = document.getElementById('schedType').value;
  var day = document.getElementById('schedDay').value;
  var title = document.getElementById('schedTitle').value.trim();
  var time = document.getElementById('schedTime').value.trim();

  if(result.error){ toast('خطأ: ' + result.error.message, 'fa-triangle-exclamation'); return; }

  closeModal('schedModal'); renderContent();
  var typeLabel = type==='exam'?'فرض/اختبار':type==='review'?'مراجعة':type==='memory'?'حفظ':'حصة';
  pushNotif(type, 'موعد جديد', typeLabel + ': ' + title + ' — ' + day);
}
async function delSched(id){
  await sb.from('schedule').delete().eq('id', id);
  state.schedule = state.schedule.filter(function(x){ return x.id!==id; });
  renderContent();
}

/* =====================================================
   CALENDAR
===================================================== */
function renderCalendar(content, titleEl){
  titleEl.textContent = 'التقويم والمواعيد';
  var now = Date.now();
  var upcoming = [];
  state.subjects.forEach(function(s){
    s.lessons.forEach(function(l){
      if(l.spaced && l.spaced.nextReview && l.spaced.nextReview > now){
        upcoming.push({type:'review', title:'مراجعة: ' + l.title, date:l.spaced.nextReview, subj:s.name, icon:s.icon, subjectId:s.id, lessonId:l.id});
      }
    });
  });
  var today = DAYS[(new Date().getDay() + 1) % 7];
  (state.schedule||[]).filter(function(x){ return x.type==='exam'; }).forEach(function(x){
    upcoming.push({type:'exam', title:'فرض/اختبار: ' + x.title, date: now, subj:x.day + (x.day===today?' (اليوم)':''), icon:'fa-file-pen'});
  });
  upcoming.sort(function(a,b){ return a.date - b.date; });

  content.innerHTML = '<div style="max-width:800px;margin:0 auto">' +
    '<h2 style="color:var(--orange);margin-bottom:18px;font-weight:800"><i class="fa-solid fa-calendar-days"></i> المواعيد القادمة</h2>' +
    (upcoming.length===0 ? '<div class="empty"><div class="icon-big"><i class="fa-solid fa-calendar-xmark"></i></div><p>لا مواعيد قادمة.</p></div>' :
      upcoming.map(function(u){
        return '<div class="section" style="margin-bottom:10px;display:flex;align-items:center;gap:16px;cursor:pointer" ' +
          (u.lessonId ? 'onclick="openLesson(\'' + u.subjectId + '\',\'' + u.lessonId + '\')"' : '') + '>' +
          '<div class="subj-icon" style="width:48px;height:48px;border-radius:14px;background:var(--orange-soft);border:1px solid var(--orange);display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:20px">' +
          '<i class="fa-solid ' + u.icon + '"></i></div>' +
          '<div style="flex:1"><div style="font-weight:700;font-size:15px">' + escapeHtml(u.title) + '</div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + escapeHtml(u.subj) + ' · ' + fmtDate(u.date) + '</div></div></div>';
      }).join('')) + '</div>';
}

/* =====================================================
   STATS
===================================================== */
function renderStats(content, titleEl){
  titleEl.textContent = 'الإحصائيات';
  var totalLessons = 0, memorized = 0, totalCards = 0, dueCards = 0;
  var now = Date.now();
  state.subjects.forEach(function(s){
    totalLessons += s.lessons.length;
    s.lessons.forEach(function(l){
      if(l.status === 'memorized') memorized++;
      totalCards += l.cards.length;
      l.cards.forEach(function(c){ if(!c.nextReview || c.nextReview <= now) dueCards++; });
    });
  });
  var pct = totalLessons ? Math.round(memorized/totalLessons*100) : 0;

  content.innerHTML = '<div style="max-width:900px;margin:0 auto">' +
    '<h2 style="color:var(--orange);margin-bottom:18px;font-weight:800"><i class="fa-solid fa-chart-line"></i> تقدمك</h2>' +
    '<div class="stats-grid">' +
    '<div class="stat-card"><i class="fa-solid fa-book"></i><div class="num">' + state.subjects.length + '</div><div class="lbl">المواد</div></div>' +
    '<div class="stat-card"><i class="fa-solid fa-file-lines"></i><div class="num">' + totalLessons + '</div><div class="lbl">الدروس</div></div>' +
    '<div class="stat-card"><i class="fa-solid fa-circle-check"></i><div class="num">' + memorized + '</div><div class="lbl">دروس محفوظة</div></div>' +
    '<div class="stat-card"><i class="fa-solid fa-layer-group"></i><div class="num">' + totalCards + '</div><div class="lbl">البطاقات</div></div>' +
    '<div class="stat-card"><i class="fa-solid fa-clock"></i><div class="num">' + dueCards + '</div><div class="lbl">بطاقات مستحقة</div></div>' +
    '<div class="stat-card"><i class="fa-solid fa-percent"></i><div class="num">' + pct + '%</div><div class="lbl">نسبة الحفظ</div></div>' +
    '</div></div>';
}

/* =====================================================
   NOTIFICATIONS TAB
===================================================== */
function renderNotifsTab(content, titleEl){
  titleEl.textContent = 'كل الإشعارات';
  var notifs = state.notifications || [];
  content.innerHTML = '<div style="max-width:800px;margin:0 auto">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">' +
    '<h2 style="color:var(--orange);font-weight:800"><i class="fa-solid fa-bell"></i> الإشعارات (' + notifs.length + ')</h2>' +
    '<button class="btn btn-ghost btn-sm" onclick="clearAllNotifs()"><i class="fa-solid fa-trash"></i> مسح الكل</button>' +
    '</div>' +
    (notifs.length===0 ? '<div class="empty"><div class="icon-big"><i class="fa-solid fa-bell-slash"></i></div><p>لا إشعارات بعد.</p></div>' :
      notifs.map(function(n){
        var icon = n.type === 'exam' ? 'fa-file-pen' : n.type === 'review' ? 'fa-rotate' : n.type === 'memory' ? 'fa-brain' : n.type === 'study' ? 'fa-lightbulb' : 'fa-bell';
        var cls = n.type === 'exam' ? 'exam' : n.type === 'review' ? 'review' : n.type === 'memory' ? 'memory' : '';
        return '<div class="notif-item ' + (n.read?'read':'') + ' ' + cls + '" style="margin-bottom:8px" onclick="markNotifRead(\'' + n.id + '\')">' +
          '<i class="fa-solid ' + icon + '"></i>' +
          '<div class="body"><strong>' + escapeHtml(n.title) + '</strong>' + escapeHtml(n.body) +
          '<div class="time"><i class="fa-regular fa-clock"></i> ' + timeAgo(n.time) + '</div></div></div>';
      }).join('')) + '</div>';
}

/* =====================================================
   POMODORO
===================================================== */
function openPomodoro(){
  document.getElementById('pomoOverlay').classList.add('show');
  updatePomoDisplay();
}
function closePomodoro(){
  document.getElementById('pomoOverlay').classList.remove('show');
  if(pomoInterval){ clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false; }
}
function updatePomoDisplay(){
  var m = Math.floor(pomoTime/60).toString().padStart(2,'0');
  var s = (pomoTime%60).toString().padStart(2,'0');
  document.getElementById('pomoTime').textContent = m + ':' + s;
  document.getElementById('pomoPhase').textContent = pomoPhase === 'focus' ? 'جلسة تركيز' : 'راحة';
  document.getElementById('pomoStartBtn').innerHTML = pomoRunning ? '<i class="fa-solid fa-pause"></i> إيقاف' : '<i class="fa-solid fa-play"></i> ابدأ';
}
function togglePomo(){
  if(pomoRunning){
    clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
  } else {
    pomoRunning = true;
    pomoInterval = setInterval(function(){
      pomoTime--;
      if(pomoTime <= 0){
        clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
        if(pomoPhase === 'focus'){
          pomoPhase = 'break'; pomoTime = 5*60;
          pushNotif('info', 'خلصت الجلسة!', 'خذ راحة 5 دقائق');
        } else {
          pomoPhase = 'focus'; pomoTime = 25*60;
          pushNotif('info', 'خلصت الراحة!', 'ابدأ جلسة جديدة');
        }
      }
      updatePomoDisplay();
    }, 1000);
  }
  updatePomoDisplay();
}
function resetPomo(){
  clearInterval(pomoInterval); pomoInterval = null; pomoRunning = false;
  pomoPhase = 'focus'; pomoTime = 25*60;
  updatePomoDisplay();
}

/* =====================================================
   INIT
===================================================== */
document.getElementById('searchInput').addEventListener('input', renderSubjects);
document.addEventListener('click', function(e){
  var panel = document.getElementById('notifPanel');
  var btn = e.target.closest('.icon-btn');
  if(panel && panel.classList.contains('show') && !panel.contains(e.target) && !btn){
    panel.classList.remove('show');
  }
});

applyTheme();
renderIconPicker();
renderSubjects();
renderContent();

document.addEventListener('click', function askOnce(){
  requestNotifPermission();
  document.removeEventListener('click', askOnce);
}, {once:true});

setInterval(checkDueReminders, 60000);
</script>
